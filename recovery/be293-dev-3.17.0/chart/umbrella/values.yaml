---
# BE-293 platform lifecycle controls. The CoreDNS patch is deliberately enabled
# for the long-standing local .tx.test demonstration only. A shared cluster must
# set this to false and use platform-owned DNS instead.
be293:
  deploymentProfile: local
  coreDnsPatch:
    enabled: true
  # AP6 fields are an explicit operator contract. Their values stay empty in
  # source; the AP6 profile fails closed until a private approved overlay fills
  # them with platform-owned configuration.
  platform:
    dnsZone: ""
    ingressClass: ""
    tlsMode: ""
    storageClass: ""
    vaultAddress: ""
    vaultAuthMode: ""
    secretDelivery: ""
    registryHost: ""

# -----------------------------------------------------------------------------
# Wallet indirection block (documentation + reference values).
#
# Tractus-X supports two wallet implementations:
#   1. SSI DIM Wallet Stub  (centralized mock, default in this umbrella)
#   2. Identity Hub         (real DCP-compliant wallet, eclipse-edc/IdentityHub)
#
# This block is a *single source of truth for documentation* of which wallet
# is active and what its endpoints are. Helm values files are plain YAML
# (not Go templates), so sub-chart values below cannot {{ tpl }}-reference
# this block directly. Instead, pick a profile:
#
#   - charts/values-test-data-exchange.yaml               -> stub (default)
#   - charts/values-test-data-exchange-identity-hub.yaml  -> Identity Hub
#
# Each profile hardcodes the per-subchart wallet URLs consistent with the
# `wallet.mode` selected here. The mutual-exclusion validator in
# templates/_wallet-validate.tpl enforces that exactly one wallet chart
# (ssi-dim-wallet-stub OR identity-hub) is enabled.
# -----------------------------------------------------------------------------
wallet:
  # Active wallet implementation. One of: "stub" | "identityHub".
  # Must match the wallet chart enabled under identity-and-trust-bundle.
  mode: stub

  # Operator BPN = trusted issuer for the whole dataspace. Seeded into BDRS
  # and used as issuer DID by Portal, Credential Issuer, and all EDCs.
  operatorBpn: "BPNL00000003CRHK"

  # Framework-agreement contract version embedded in the
  # DataExchangeGovernance / FrameworkAgreement credentials issued by the seed
  # Job. This MUST match the version in the dataspace access/usage policies'
  # `FrameworkAgreement eq DataExchangeGovernance:<version>` constraint — the
  # cx-policy FrameworkAgreementConstraintFunction does an EXACT string match on
  # the version after ':', so a mismatch silently breaks contract negotiation.
  # Surfaced to the seed Job via the `<release>-wallet-mode` ConfigMap.
  frameworkContractVersion: "1.0"

  # ---------------------------------------------------------------------------
  # Single source of truth for participants (§5 Phase A of the #1609 plan).
  #
  # Consumed by:
  #   - templates/_wallet-derive.tpl            (helpers compute DID / CS URL / STS URL)
  #   - tx-data-provider post-install-identityhub-seed Job (creates ParticipantContexts)
  #
  # Keys must be stable lowercase slugs (used as k8s label values and API keys).
  # ---------------------------------------------------------------------------
  participants:
    operator:
      bpn: "BPNL00000003CRHK"
      role: operator   # operator | provider | consumer
      # Credential set requested from the IssuerService for this participant.
      # NOTE: BpnCredential is mandatory — the tractusx-edc DSP catalog
      # verifier requests MembershipCredential + BpnCredential +
      # DataExchangeGovernanceCredential, and rejects the presentation
      # (HTTP 401 Unauthorized) if any of the three is missing.
      credentials:
        - MembershipCredential
        - BpnCredential
        - DataExchangeGovernanceCredential
        - FrameworkAgreementCredential
    provider:
      bpn: "BPNL00000003AYRE"
      role: provider
      credentials:
        - MembershipCredential
        - BpnCredential
        - DataExchangeGovernanceCredential
        - FrameworkAgreementCredential
      # D23b: connector-local Vault coordinates. The IH seed Job writes the
      # STS client_secret returned by the ParticipantContext-create 201
      # response here under `secret/data/edc-wallet-secret`, so the
      # connector's RemoteSecureTokenService can authenticate against IH.
      # Template-expanded by charts/umbrella/templates/configmap-wallet-mode.yaml.
      vaultUrl: "http://{{ .Release.Name }}-edc-dataprovider-vault:8200"
      vaultToken: "<<SET-FROM-SECRET-STORE:umbrella-defaults:wallet.participants.provider.vaultToken>>"
    consumer1:
      bpn: "BPNL00000003AZQP"
      role: consumer
      credentials:
        - MembershipCredential
        - BpnCredential
        - DataExchangeGovernanceCredential
        - FrameworkAgreementCredential
      vaultUrl: "http://{{ .Release.Name }}-edc-dataconsumer-1-vault:8200"
      vaultToken: "<<SET-FROM-SECRET-STORE:umbrella-defaults:wallet.participants.consumer1.vaultToken>>"
    consumer2:
      bpn: "BPNL00000003AVTH"
      role: consumer
      credentials:
        - MembershipCredential
        - BpnCredential
        - DataExchangeGovernanceCredential
        - FrameworkAgreementCredential
      vaultUrl: "http://{{ .Release.Name }}-edc-dataconsumer-2-vault:8200"
      vaultToken: "<<SET-FROM-SECRET-STORE:umbrella-defaults:wallet.participants.consumer2.vaultToken>>"

  # Endpoint reference for the SSI DIM Wallet Stub (mode=stub).
  stub:
    host: "ssi-dim-wallet-stub.tx.test"
    serviceDns: "ssi-dim-wallet-service"                              # in-cluster Service
    baseUrl: "http://ssi-dim-wallet-stub.tx.test"
    stsUrl:  "http://ssi-dim-wallet-stub.tx.test/api/sts"
    tokenUrl: "http://ssi-dim-wallet-stub.tx.test/oauth/token"
    credentialServiceUrl: "http://ssi-dim-wallet-stub.tx.test/api"
    didBase: "did:web:ssi-dim-wallet-stub.tx.test"                    # did:web:<didBase>:<BPN>

  # Endpoint reference for Identity Hub (mode=identityHub).
  # Two topologies: "shared" (multi-tenant) or "perParticipant" (one IH per BPN).
  #
  # Two URL families are tracked per topology:
  #   * public*  — ingress hostnames used for did:web resolution and for
  #                EDC-to-EDC cross-participant handshakes. Must resolve
  #                both inside and outside the cluster.
  #   * internal* — in-cluster Service DNS + named port. Used by the
  #                 seeding Job and other in-cluster admin traffic. Does
  #                 NOT depend on ingress working.
  identityHub:
    topology: shared
    # TEMPORARY (#1609 demonstration era): sentinel proving the EDC-0.17.0-aligned
    # local-image overlay is layered. The render fails when wallet.mode=identityHub
    # without it (see templates/_wallet-validate.tpl → validateIdentityHubImageOverlay),
    # because the released 0.16.0 pins cannot complete the DCP transfer. The overlay
    # `values-test-data-exchange-identity-hub-local-0.17.0.yaml` sets this true.
    # Remove both once connector 0.13.0 + IH/IS 0.17.0 are released and pinned.
    imagesOverridden: false
    shared:
      # Public (ingress) identity — used for did:web documents.
      host: "identity-hub.tx.test"
      baseUrl: "http://identity-hub.tx.test"
      stsUrl:  "http://identity-hub.tx.test/api/sts"
      tokenUrl: "http://identity-hub.tx.test/oauth/token"
      credentialServiceUrl: "http://identity-hub.tx.test/api"
      didBase: "did:web:identity-hub.tx.test"
      issuerServiceHost: "issuer-service.tx.test"
      issuerServiceBaseUrl: "http://issuer-service.tx.test"
      # In-cluster service names (must match the Helm release name of the
      # IH / IS sub-charts). When deployed under umbrella with the aliases
      # `identity-hub` and `issuer-service`, the upstream charts produce
      # services named `<release>-identity-hub` and `<release>-issuer-service`.
      # The {{.Release.Name}} prefix is injected at render time by the
      # derived ConfigMap template.
      internalIdentityHubService: "identity-hub"         # -> <release>-identity-hub
      internalIssuerServiceService: "issuer-service"     # -> <release>-issuer-service
      # Port map (matches identity-hub / tractusx-issuerservice-memory v0.2.0).
      # NOTE: IS exposes BOTH a tenant identity API (`/api/identity` on 8087)
      # AND an issuer-admin API (`/api/admin` on 8086). The latter is named
      # `issueradmin` in bruno docs but mounted at `/api/admin` per the
      # tractusx-issuerservice chart README.
      ports:
        ihIdentity: 8081        # /api/identity
        ihCredentials: 8082     # /api/credentials
        ihDid: 8083             # /
        ihSts: 8087             # /api/sts
        isIssuerAdmin: 8086     # /api/admin   (note: NOT /api/issueradmin)
        isIdentity: 8087        # /api/identity
        isIssuance: 8082        # /api/issuance
    perParticipant:
      # Map participant slug (the keys of wallet.participants:
      # operator | provider | consumer1 | consumer2) -> ingress host for that
      # participant's OWN Identity Hub. Populated only when
      # topology=perParticipant (see
      # values-test-data-exchange-identity-hub-per-participant.yaml).
      # DIDs are constructed as did:web:<hosts[slug]> (host root, no BPN path).
      hosts: {}
      # Map participant slug -> in-cluster IdentityHub "name" (the Helm
      # dependency alias). The upstream chart renders Service
      # `<release>-<base>` and pod label `app.kubernetes.io/name=<base>`.
      # The operator reuses the bundle's IdentityHub (alias `identity-hub`);
      # provider/consumer1/consumer2 use the umbrella-level aliased IH deps.
      # Consumed by the derived ConfigMap + seeding Job to reach each IH.
      # Ports are chart-invariant, so the shared.ports map above is reused.
      serviceBase:
        operator:  "identity-hub"
        provider:  "identity-hub-provider"
        consumer1: "identity-hub-consumer1"
        consumer2: "identity-hub-consumer2"

