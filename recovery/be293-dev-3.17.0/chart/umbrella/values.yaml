  enabled: false
  replicaCount: 1
  postgresql:
    ## TEMPORALY UNTIL NEW PORTAL UPDATE
    enabled: true
    image:
      registry: docker.io
      repository: bitnamilegacy/postgresql
      tag: "15-debian-11"
    commonLabels:
      app.kubernetes.io/version: "15"
    ## UNTIL HERE
    nameOverride: "portal-backend-postgresql"
    architecture: standalone
    auth:
      password: "<<SET-FROM-SECRET-STORE:umbrella-defaults:portal.postgresql.auth.password>>"
      portalPassword: "<<SET-FROM-SECRET-STORE:umbrella-defaults:portal.postgresql.auth.portalPassword>>"
      replicationPassword: "<<SET-FROM-SECRET-STORE:umbrella-defaults:portal.postgresql.auth.replicationPassword>>"
      provisioningPassword: "<<SET-FROM-SECRET-STORE:umbrella-defaults:portal.postgresql.auth.provisioningPassword>>"
    primary:
      persistence:
        enabled: false
  portalAddress: "http://portal.tx.test"
  portalBackendAddress: "http://portal-backend.tx.test"
  centralidp:
    address: "http://centralidp.tx.test"
  sharedidpAddress: "http://sharedidp.tx.test"
  semanticsAddress: "http://semantics.tx.test"
  bpdm:
    poolAddress: "http://business-partners.tx.test"
    poolApiPath: "/pool/v6"
    portalGateAddress: "http://business-partners.tx.test"
    portalGateApiPath: "/gate/v6"
  custodianAddress: "http://ssi-dim-wallet-stub.tx.test"
  dimWrapper:
    baseAddress: "http://ssi-dim-wallet-stub.tx.test"
    apiPath: "/api/dim"
    tokenAddress: "http://ssi-dim-wallet-stub.tx.test/oauth/token"
  decentralIdentityManagementAuthAddress: "http://ssi-dim-wallet-stub.tx.test/api/sts"
  sdfactoryAddress: "http://sdfactory.tx.test"
  # -- no configuration for clearinghouse because it's an external component
  clearinghouseConnectDisabled: true
  clearinghouse:
    default:
      baseAddress: "http://validation.tx.test"
      # -- clientId and clientSecret aren't in the centralidp Keycloak
      clientId: "clearinghouse-client-id-default"
      clientSecret: "<<SET-FROM-SECRET-STORE:umbrella-defaults:portal.clearinghouse.default.clientSecret>>"
      tokenAddress: "http://someiam.tx.test/realms/example/protocol/openid-connect/token"
      clearinghouseConnectDisabled: true
  issuerComponentAddress: "http://ssi-credential-issuer.tx.test"
  frontend:
    ingress:
      enabled: true
      annotations:
        # uncomment the following line for tls
        # cert-manager.io/cluster-issuer: "my-ca-issuer"
        nginx.ingress.kubernetes.io/rewrite-target: "/$1"
        nginx.ingress.kubernetes.io/use-regex: "true"
        nginx.ingress.kubernetes.io/enable-cors: "true"
        nginx.ingress.kubernetes.io/cors-allow-origin: "http://*.tx.test"
      # uncomment the following lines for tls
      # tls:
      #   # -- Provide tls secret.
      #   - secretName: "portal.tx.test-tls"
      #     # -- Provide host for tls secret.
      #     hosts:
      #       - "portal.tx.test"
      hosts:
        - host: "portal.tx.test"
          paths:
            - path: "/(.*)"
              pathType: "ImplementationSpecific"
              backend:
                service: "portal"
                port: 8080
            - path: "/registration/(.*)"
              pathType: "ImplementationSpecific"
              backend:
                service: "registration"
                port: 8080
            - path: "/((assets|documentation)/.*)"
              pathType: "ImplementationSpecific"
              backend:
                service: "assets"
                port: 8080
  backend:
    dotnetEnvironment: "Development"
    keycloak:
      central:
        clientId: "sa-cl1-reg-2"
        clientSecret: "<<SET-FROM-SECRET-STORE:umbrella-defaults:portal.backend.keycloak.central.clientSecret>>"
        jwtBearerOptions:
          requireHttpsMetadata: "false"
      shared:
        clientId: "sa-cl1-reg-1"
        clientSecret: "<<SET-FROM-SECRET-STORE:umbrella-defaults:portal.backend.keycloak.shared.clientSecret>>"
    registration:
      logging:
        default: "Debug"
        bpdmLibrary: "Debug"
        registrationService: "Debug"
      swaggerEnabled: true
    administration:
      logging:
        default: "Debug"
        businessLogic: "Debug"
        sdfactoryLibrary: "Debug"
        bpdmLibrary: "Debug"
        custodianLibrary: "Debug"
      serviceAccount:
        encryptionConfigs:
          index0:
            encryptionKey: "<<SET-FROM-SECRET-STORE:umbrella-defaults:portal.backend.administration.serviceAccount.encryptionConfigs.index0.encryptionKey>>"
      issuerdid: "did:web:ssi-dim-wallet-stub.tx.test:BPNL00000003CRHK"
      swaggerEnabled: true
    appmarketplace:
      logging:
        default: "Debug"
        offersLibrary: "Debug"
      swaggerEnabled: true
    services:
      logging:
        default: "Debug"
        offersLibrary: "Debug"
      swaggerEnabled: true
    notification:
      logging:
        default: "Debug"
      swaggerEnabled: true
    processesworker:
      logging:
        default: "Debug"
        processesLibrary: "Debug"
        bpdmLibrary: "Debug"
        clearinghouseLibrary: "Debug"
        custodianLibrary: "Debug"
        sdfactoryLibrary: "Debug"
        offerProvider: "Debug"
      bpdm:
        clientId: &bpdmAdminClientId "sa-cl7-cx-5"
        clientSecret: "<<SET-FROM-SECRET-STORE:umbrella-defaults:portal.backend.processesworker.bpdm.clientSecret>>"
      custodian:
        clientId: "sa-cl5-custodian-2"
        clientSecret: "<<SET-FROM-SECRET-STORE:umbrella-defaults:portal.backend.processesworker.custodian.clientSecret>>"
      sdfactory:
        issuerBpn: "BPNL00000003CRHK"
        clientId: "sa-cl8-cx-1"
        clientSecret: "<<SET-FROM-SECRET-STORE:umbrella-defaults:portal.backend.processesworker.sdfactory.clientSecret>>"
      offerprovider:
        clientId: "sa-cl2-03"
