# Persistent (PostgreSQL-backed) BDRS. Default OFF so the stub / shared / memory
# profiles never instantiate it (they use bdrs-server-memory above). The postgres
# profiles flip this on (and bdrs-server-memory off). Explicit `enabled: false`
# is required: Helm treats a missing condition path as enabled, which would
# render this alongside the memory variant (both claim fullnameOverride
# `bdrs-server`) and collide. Full config lives in the postgres profiles.
bdrs-server:
  enabled: false

# -----------------------------------------------------------------------------
# Per-participant IdentityHub instances (#1609 per-participant topology).
# DISABLED by default — the `shared` topology uses a single IdentityHub from
# identity-and-trust-bundle. The per-participant profile
# (values-test-data-exchange-identity-hub-per-participant.yaml) flips these to
# `enabled: true` and supplies the full per-host configuration (ingresses,
# probes, resources, did:web host, super-user key alias). Keeping only
# `enabled: false` here means the default / stub / shared profiles never
# instantiate these pods.
# -----------------------------------------------------------------------------
identity-hub-provider:
  enabled: false
identity-hub-consumer1:
  enabled: false
identity-hub-consumer2:
  enabled: false
# Postgres variant of consumer1's per-participant IdentityHub (umbrella-level dep
# alias). Default OFF so only the per-participant-POSTGRES profile
# (values-test-data-exchange-identity-hub-per-participant-postgres.yaml) enables it.
# Without this default Helm treats the missing condition path as enabled, so the
# alias would render its own bundled Vault in every profile — colliding with the
# issuer-service Vault on the `<release>-vault` ServiceAccount and failing install.
identity-hub-consumer1-postgres:
  enabled: false

