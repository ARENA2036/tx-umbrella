{{- if and (index .Values "bdrs-server").enabled (dig "be293Provisioning" "enabled" false (index .Values "bdrs-server")) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-bdrs-vault
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      be293.vault-owner: bdrs
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bdrs-server
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - {protocol: TCP, port: 8200}
{{- end }}
