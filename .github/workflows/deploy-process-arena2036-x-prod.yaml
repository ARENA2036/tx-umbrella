# ######################################################
# Automatic Deployment Process for Arena2036-X - prod
# ######################################################
---
name: Continuous Deployment Arena-X (prod)

on:
  # push:
  #   branches: [ main ]
  # pull_request:
  #   branches: [ main ]

  workflow_dispatch:
    inputs:
      cluster_context:
        description: "Environment (prod)"
        default: 'prod'
        required: false
        type: string
      deployment_name:
        description: 'Helm release name e.g, federated'
        default: 'federated'
        required: false
        type: string
      deployment_type:
        description: "Deployment action e.g, (install release, upgrade release, uninstall release)"
        default: 'upgrade'
        required: false
        type: choice
        options:
          - install
          - upgrade
          - uninstall
      helm_values_file:
        description: 'Comma-separated list of Helm values files (relative paths)'
        default: 'charts/umbrella/values-prod.yaml'
        required: false
        type: string
      namespace:
        description: 'Namespace to deploy the release'
        default: 'release25-09'
        required: false
        type: string
      rollback_on_failure:
        description: "Rollback release if deployment fails"
        required: false
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Install kubectl
        run: |
          echo "Installing kubectl..."
          curl -LO -s "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          kubectl version --client

      - name: Install Vault CLI
        run: |
          curl -sSL https://releases.hashicorp.com/vault/1.21.2/vault_1.21.2_linux_amd64.zip -o vault.zip
          unzip vault.zip
          chmod +x vault
          sudo mv vault /usr/local/bin/
          vault --version

      - name: Fetch kubeconfig from Vault and connect to cluster
        run: |
          mkdir -p $HOME/.kube
          export VAULT_ADDR="${{ secrets.VAULT_ADDR_PROD }}"
          export VAULT_TOKEN="${{ secrets.VAULT_TOKEN_PROD }}"
          CLUSTER_PATH="staging/infra/cluster-prod"
          # Fetch kubeconfig
          vault kv get -field=config $CLUSTER_PATH > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

          # Extract current context
          CONTEXT=$(yq e '.current-context' $HOME/.kube/config)
          echo "Using context: $CONTEXT"

          # Test cluster connection
          kubectl --context=$CONTEXT cluster-info

      - name: Install Helm
        uses: azure/setup-helm@b7246b12e77f7134dc2d460a3d5bad15bbe29390 # v4.1.0
        with:
          version: v3.12.1
    
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy Release
        working-directory: .
        run: |
          NAMESPACE="${{ github.event.inputs.namespace }}"
          RELEASE_NAME="${{ github.event.inputs.deployment_name }}"
          VALUE_FILES="${{ github.event.inputs.helm_values_file }}"
          TYPE="${{ github.event.inputs.deployment_type }}"
          ROLLBACK="${{ github.event.inputs.rollback_on_failure }}"

          # Build Helm values arguments
          HELM_VALUES_ARGS=""
          IFS=',' read -ra FILE_ARRAY <<< "$VALUE_FILES"
          for f in "${FILE_ARRAY[@]}"; do
            HELM_VALUES_ARGS="$HELM_VALUES_ARGS --values $f"
          done

          # Rollback/atomic option
          if [ "$ROLLBACK" = "true" ]; then
            EXTRA_ARGS="--atomic"
          else
            EXTRA_ARGS=""
          fi

          # Run Helm dependencies script
            chmod +x hack/helm-dependencies.bash
            ./hack/helm-dependencies.bash
            echo "Running deployment script..."
            
            echo "Building umbrella dependencies..."
            helm dependency build charts/umbrella --debug
            echo "Dependencies successfully built!"

          if [ "$TYPE" = "install" ]; then
            helm install "$RELEASE_NAME" charts/umbrella --namespace "$NAMESPACE" --create-namespace $HELM_VALUES_ARGS $EXTRA_ARGS --debug
    
          elif [ "$TYPE" = "upgrade" ]; then
            helm upgrade --install "$RELEASE_NAME" charts/umbrella --namespace "$NAMESPACE" --create-namespace $HELM_VALUES_ARGS $EXTRA_ARGS --debug

          elif [ "$TYPE" = "uninstall" ]; then
            helm uninstall "$RELEASE_NAME" --namespace "$NAMESPACE" --debug

          else
            echo "Unknown deployment_type: $TYPE"
            exit 1
          fi

          # Only run post-deployment scripts if install/upgrade
          if [[ "$TYPE" == "install" || "$TYPE" == "upgrade" ]]; then
              echo "Release deployed successfully. Running post-deployment scripts..."

              # Encode GitHub secrets
              SMTP_PASSWORD_B64=$(echo -n "${{ secrets.ARENA_SMTP_PASSWORD }}" | base64 -w 0)
              SMTP_PORT_B64=$(echo -n "${{ secrets.ARENA_SMTP_PORT }}" | base64 -w 0)
              SMTP_SERVER_B64=$(echo -n "${{ secrets.ARENA_SMTP_SERVER }}" | base64 -w 0)
              SMTP_USERNAME_B64=$(echo -n "${{ secrets.ARENA_SMTP_USERNAME }}" | base64 -w 0)

              # Patch federated sharedidp secret
              if kubectl get secret "$RELEASE_NAME"-sharedidp-cx-operator-realm-seeding -n "$NAMESPACE" >/dev/null 2>&1; then
                  kubectl patch secret "$RELEASE_NAME"-sharedidp-cx-operator-realm-seeding -n "$NAMESPACE" \
                    --type=merge -p "$(cat <<EOF
          {
            "data": {
              "mailing-password": "$SMTP_PASSWORD_B64",
              "mailing-port": "$SMTP_PORT_B64",
              "mailing-host": "$SMTP_SERVER_B64",
              "mailing-from": "$SMTP_USERNAME_B64",
              "mailing-reply-to": "$SMTP_USERNAME_B64",
              "mailing-username": "$SMTP_USERNAME_B64"
            }
          }
          EOF
          )"
              else
                  echo "Secret $RELEASE_NAME-sharedidp-cx-operator-realm-seeding not found, skipping patch"
              fi

              # Patch portal-backend-mailing secret
              if kubectl get secret portal-backend-mailing -n "$NAMESPACE" >/dev/null 2>&1; then
                  kubectl patch secret portal-backend-mailing -n "$NAMESPACE" \
                    --type=merge -p "$(cat <<EOF
          {
            "data": {
              "password": "$SMTP_PASSWORD_B64",
              "provisioning-sharedrealm-password": "$SMTP_PASSWORD_B64"
            }
          }
          EOF
          )"
              else
                  echo "Secret portal-backend-mailing not found, skipping patch"
              fi

              # Restart deployment to apply secret changes
              echo "Restarting deployment to apply updated secrets..."
              kubectl rollout restart deployment "$RELEASE_NAME" -n "$NAMESPACE" || true

              echo "Post-deployment scripts completed successfully."
          fi