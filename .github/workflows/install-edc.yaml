---
name: Install EDC (Install or Upgrade)

on:
  push:
    branches:
      - feat/install-edc-script
      - develop
      - main

  # pull_request:
  #   paths:
  #     - 'charts/**'
  #     - '!**/README.md'
  #     - '.github/workflows/helm-checks.yaml'
    
  workflow_dispatch:
    inputs:
      cluster_context:
        default: 'upgrade'
        required: false
        description: "Select the environment"
        type: choice
        options:
        - staging
        - prod
      release_name:
        description: 'helm deployment name e.g, umbrella-edc'
        default: 'umbrella-edc'
        required: false
        type: string
      release_type:
        default: 'upgrade'
        required: false
        description: "Select the command"
        type: choice
        options:
        - install
        - upgrade
        - uninstall
      helm_values_file:
        description: 'the relative path to the helm values.yaml'
        default: 'values-edcs-staging.yaml'
        required: false
        type: string
      namespace:
        description: 'the namespace where the edc is to be deployed'
        default: 'default'
        required: false
        type: string

jobs:
  install-edc:
    runs-on: ubuntu-latest
    steps:
      - name: Import Secrets from staging Vault
        id: import-staging-secrets
        # retrieve values from vault for staging
        if: ${{ github.event.inputs.cluster_context  == 'staging' }}
        uses: hashicorp/vault-action@v2
        with:
          url: ${{ secrets.VAULT_ADDR_STAGING }}
          token: ${{ secrets.VAULT_TOKEN_STAGING }}
          secrets: |
            staging/data/data/cluster config | KUBECONFIG ;

      - name: Import Secrets from prod Vault
        id: import-prod-secrets
        # retrieve values from vault for prod
        if: ${{ github.event.inputs.cluster_context == 'prod' }}
        uses: hashicorp/vault-action@v2
        with:
          url: ${{ secrets.VAULT_ADDR_PROD }}
          token: ${{ secrets.VAULT_TOKEN_PROD }}
          secrets: |
            staging/data/data/cluster-prod config | KUBECONFIG ;

      - name: Install kubectl
        run: |
          echo "kubectl is not installed, installing Kubectl..."
          curl -LO -s "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          # Make it executable
          chmod +x kubectl
          # Move to a directory in your PATH
          sudo mv kubectl /usr/local/bin/
          # Verify installation
          kubectl version --client
          echo "kubectl installed successfully!"
          ## kubectl version check
          echo "Checking kubectl version..."
          echo `kubectl version`
      
      
      - name: Setup Cluster Context
        run: |
          mkdir -p $HOME/.kube
          CONFIG_PATH="$HOME/.kube/config"
          if [[ "${{ github.event.inputs.cluster_context }}" == "staging" ]]; then  
            echo "Setting context for staging..."  
            cat <<EOF > $CONFIG_PATH
            ${{ steps.import-staging-secrets.outputs.KUBECONFIG }}
            EOF
          elif [[ "${{ github.event.inputs.cluster_context }}" == "prod" ]]; then
            echo "Setting context for production..."  
            cat <<EOF > $CONFIG_PATH
            ${{ steps.import-prod-secrets.outputs.KUBECONFIG }}
            EOF
          else
            echo "Not a valid environment"
            exit 1
          fi
          chmod 600 $CONFIG_PATH
          export KUBECONFIG="$CONFIG_PATH"
          echo "KUBECONFIG=$CONFIG_PATH" >> $GITHUB_ENV
          kubectl --context=${{ github.event.inputs.cluster_context }} cluster-info
 

      - name: Set up Helm
        uses: azure/setup-helm@b7246b12e77f7134dc2d460a3d5bad15bbe29390 # v4.1.0
        with:
          version: v3.12.1
      
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Deploy EDC
        working-directory: hack/
        run: |
          chmod +x ./install-edc.sh
          echo "Running deployment script..."
          if [ "${{ github.event.inputs.release_type }}" = "uninstall" ]; then
            helm uninstall ${{ github.event.inputs.release_name }} --namespace ${{ github.event.inputs.namespace }}
          elif [ "${{ github.event.inputs.release_type }}" = "install" ] || [ "${{ github.event.inputs.release_type }}" = "upgrade" ]; then
            ./install-edc.sh ${{ github.event.inputs.cluster_context }} ${{ github.event.inputs.release_name }} ${{ github.event.inputs.release_type }} ${{ github.event.inputs.helm_values_file }} ${{ github.event.inputs.namespace }}
          else
            echo "Invalid release_type"
            exit 1
          fi
