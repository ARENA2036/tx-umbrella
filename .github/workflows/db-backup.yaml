name: Database Backup - PostgresSQL

on:
  push:
    branches:
      - DT-55-automated-database-backup

  workflow_dispatch:
    inputs:
      cluster_context:
        description: "Select environment"
        required: true
        default: "prod"
        type: choice
        options:
          - prod
          - staging

      namespace:
        description: "Kubernetes namespace to back up e.g, release25-09"
        required: true
        default: "release25-09"

      release_name:
        description: "Enter release name e.g, fed-services"
        required: true
        default: "federated"

  # schedule:
  #   - cron: '0 20 * * 5' # Runs every Friday at 8 PM UTC

jobs:
  db-backup:
    name: Run PostgreSQL Backups
    runs-on: ubuntu-latest

    env:
      TARGET_CONTEXT: ${{ github.event.inputs.cluster_context || 'prod' }}
      NAMESPACE: ${{ github.event.inputs.namespace || 'release25-09' }}
      RELEASE_NAME: ${{ github.event.inputs.release_name || 'federated' }}

      SHAREDIDP_DB_PASSWORD: ${{ secrets.SHAREDIDP_DB_PASSWORD }}
      PORTAL_DB_PASSWORD: ${{ secrets.PORTAL_DB_PASSWORD }}
      ISSUER_DB_PASSWORD: ${{ secrets.ISSUER_DB_PASSWORD }}
      DISCOVERYFINDER_DB_PASSWORD: ${{ secrets.DISCOVERYFINDER_DB_PASSWORD }}
      DATACONSUMER_DB_PASSWORD: ${{ secrets.DATACONSUMER_DB_PASSWORD }}
      CENTRALIDP_DB_PASSWORD: ${{ secrets.CENTRALIDP_DB_PASSWORD }}
      BPNDISCOVERY_DB_PASSWORD: ${{ secrets.BPNDISCOVERY_DB_PASSWORD }}

      # WALLET_DB_PASSWORD: ${{ secrets.WALLET_DB_PASSWORD }}
      # DATAPROVIDER_DB_PASSWORD: ${{ secrets.DATAPROVIDER_DB_PASSWORD }}
      # DATAPROVIDER_DTR_DB_PASSWORD: ${{ secrets.DATAPROVIDER_DTR_DB_PASSWORD }}

      WALLET_DB_PASSWORD: postgrespassword
      DATAPROVIDER_DB_PASSWORD: dbpasswordtxdataprovider
      DATAPROVIDER_DTR_DB_PASSWORD: password

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install kubectl
        run: |
          echo "Installing kubectl..."
          curl -LO -s "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          kubectl version --client

      - name: Install Vault CLI
        run: |
          curl -sSL https://releases.hashicorp.com/vault/1.21.2/vault_1.21.2_linux_amd64.zip -o vault.zip
          unzip vault.zip
          chmod +x vault
          sudo mv vault /usr/local/bin/
          vault --version

      - name: Fetch kubeconfig from Vault and connect to cluster
        run: |
          mkdir -p "$HOME/.kube"

          if [[ "$TARGET_CONTEXT" == "prod" ]]; then
            export VAULT_ADDR="${{ secrets.VAULT_ADDR_PROD }}"
            export VAULT_TOKEN="${{ secrets.VAULT_TOKEN_PROD }}"
            CLUSTER_PATH="staging/infra/cluster-prod"
          elif [[ "$TARGET_CONTEXT" == "staging" ]]; then
            export VAULT_ADDR="${{ secrets.VAULT_ADDR_STAGING }}"
            export VAULT_TOKEN="${{ secrets.VAULT_TOKEN_STAGING }}"
            CLUSTER_PATH="staging/infra/cluster-staging"
          else
            echo "Invalid TARGET_CONTEXT: $TARGET_CONTEXT"
            exit 1
          fi

          echo "Fetching kubeconfig from Vault path: $CLUSTER_PATH"
          vault kv get -field=config "$CLUSTER_PATH" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"
          export KUBECONFIG="$HOME/.kube/config"

          CONTEXT=$(kubectl config current-context)
          echo "Using kube context from config: $CONTEXT"

          kubectl cluster-info

      - name: Run Database Backup Script
        run: |
          chmod +x ./hack/db-backup.sh
          ./hack/db-backup.sh

      - name: Compress backups and logs
        if: success()
        run: |
          TIMESTAMP=$(date +%Y-%m-%d_%H-%M-%S)
          tar -czf db-backup-$TARGET_CONTEXT-$TIMESTAMP.tar.gz ./backup ./logs
    
      - name: Upload Backup to SharePoint
        if: success()
        run: |
          FILE=$(ls db-backup-*.tar.gz | head -n 1)

          TARGET_URL="${SHAREPOINT_UPLOAD_URL_DB_BACKUP}/${SHAREPOINT_FOLDER_NAME_DB_BACKUP}/$(basename "$FILE")"

          echo "Uploading $FILE to SharePoint..."
          echo "Target folder: ${SHAREPOINT_FOLDER_NAME_DB_BACKUP}"

          curl --fail \
            -u "${SHAREPOINT_USERNAME_DB_BACKUP}:${SHAREPOINT_PASSWORD_DB_BACKUP}" \
            -T "$FILE" \
            "$TARGET_URL"

          echo "SharePoint upload completed."

      - name: Upload Backup Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.TARGET_CONTEXT }}
          path: db-backup-*.tar.gz
          retention-days: 30
