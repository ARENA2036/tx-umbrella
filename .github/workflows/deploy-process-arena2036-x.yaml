# ##############################################
# Automatic Deployment Process for Arena2036-X
# ##############################################
---
name: Continuous Deployment Arena-X

on:
  # push:
  #   branches: [ feature/deploy-process-arena2036-x ]
  # pull_request:
  #   branches: [ feature/deploy-process-arena2036-x ]

  workflow_dispatch:
    inputs:
      cluster_context:
        description: "Select the environment e.g, (staging, prod)"
        default: 'staging'
        required: false
        type: choice
        options:
          - staging
          - prod
      deployment_name:
        description: 'Helm release name e.g, umbrella'
        default: 'umbrella'
        required: false
        type: string
      deployment_type:
        description: "Deployment action e.g, (install release, upgrade release, uninstall release)"
        default: 'upgrade'
        required: false
        type: choice
        options:
          - install
          - upgrade
          - uninstall
      helm_values_file:
        description: 'Comma-separated list of Helm values files (relative paths)'
        default: 'charts/umbrella/values.yaml'
        required: false
        type: string
      namespace:
        description: 'Namespace to deploy the release'
        default: 'umbrella'
        required: false
        type: string
      rollback_on_failure:
        description: "Rollback release if deployment fails"
        required: false
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Install kubectl
      # -----------------------------
      - name: Install kubectl
        run: |
          echo "Installing kubectl..."
          curl -LO -s "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          kubectl version --client

      # -----------------------------
      # Install Vault CLI
      # -----------------------------
      - name: Install Vault CLI
        run: |
          curl -sSL https://releases.hashicorp.com/vault/1.21.2/vault_1.21.2_linux_amd64.zip -o vault.zip
          unzip vault.zip
          chmod +x vault
          sudo mv vault /usr/local/bin/
          vault --version

      # -----------------------------
      # Fetch kubeconfig from Vault
      # -----------------------------
      - name: Fetch kubeconfig from Vault
        run: |
          mkdir -p $HOME/.kube

          # Select Vault secrets based on cluster_context
          if [ "${{ github.event.inputs.cluster_context }}" = "staging" ]; then
            export VAULT_ADDR="${{ secrets.VAULT_ADDR_STAGING }}"
            export VAULT_TOKEN="${{ secrets.VAULT_TOKEN_STAGING }}"
            CLUSTER_PATH="staging/infra/cluster-staging"
          elif [ "${{ github.event.inputs.cluster_context }}" = "prod" ]; then
            export VAULT_ADDR="${{ secrets.VAULT_ADDR_PROD }}"
            export VAULT_TOKEN="${{ secrets.VAULT_TOKEN_PROD }}"
            CLUSTER_PATH="prod/infra/cluster-prod"
          else
            echo "Invalid cluster_context: ${{ github.event.inputs.cluster_context }}"
            exit 1
          fi

          # Fetch kubeconfig
          vault kv get -field=config $CLUSTER_PATH > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

          # Extract current context
          CONTEXT=$(yq e '.current-context' $HOME/.kube/config)
          echo "Using context: $CONTEXT"

          # Test cluster connection
          kubectl --context=$CONTEXT cluster-info
          kubectl --context=$CONTEXT get nodes

      # -----------------------------
      # Install Helm
      # -----------------------------
      - name: Install Helm
        uses: azure/setup-helm@b7246b12e77f7134dc2d460a3d5bad15bbe29390 # v4.1.0
        with:
          version: v3.12.1
    
      # -----------------------------
      # Checkout Code
      # -----------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------
      # Ensure Namespace Exists
      # -----------------------------
      - name: Ensure Namespace Exists
        run: |
          NAMESPACE="${{ github.event.inputs.namespace }}"
          kubectl get namespace "$NAMESPACE" || kubectl create namespace "$NAMESPACE"

      # -----------------------------
      # Deploy Release
      # -----------------------------
      - name: Deploy Release
        run: |
          NAMESPACE="${{ github.event.inputs.namespace }}"
          RELEASE_NAME="${{ github.event.inputs.deployment_name }}"
          VALUE_FILES="${{ github.event.inputs.helm_values_file }}"
          TYPE="${{ github.event.inputs.deployment_type }}"
          ROLLBACK="${{ github.event.inputs.rollback_on_failure }}"

          # Build Helm values arguments
          HELM_VALUES_ARGS=""
          IFS=',' read -ra FILE_ARRAY <<< "$VALUE_FILES"
          for f in "${FILE_ARRAY[@]}"; do
            HELM_VALUES_ARGS="$HELM_VALUES_ARGS --values $f"
          done

          # Rollback/atomic option
          if [ "$ROLLBACK" = "true" ]; then
            EXTRA_ARGS="--atomic"
          else
            EXTRA_ARGS=""
          fi

          # Deploy using Helm
          if [ "${{ github.event.inputs.deployment_type }}" = "install" ]; then
            helm dependency update ./helm
            helm install "$RELEASE_NAME" ./helm --namespace "$NAMESPACE" $HELM_VALUES_ARGS $EXTRA_ARGS

          elif [ "${{ github.event.inputs.deployment_type }}" = "upgrade" ]; then
            helm dependency update ./helm
            helm upgrade --install "$RELEASE_NAME" ./helm --namespace "$NAMESPACE" $HELM_VALUES_ARGS $EXTRA_ARGS

          elif [ "${{ github.event.inputs.deployment_type }}" = "uninstall" ]; then
            helm uninstall "$RELEASE_NAME" --namespace "$NAMESPACE"

          else
            echo "Unknown deployment_type: ${{ github.event.inputs.deployment_type }}"
            exit 1
          fi