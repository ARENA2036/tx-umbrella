---
# Portable defaults. Public hosts use example.org; an environment file such as values-test-tractus-x.yaml sets the
# real ones. Every component has a fixed fullnameOverride, so in-cluster URLs are plain Service names in the release
# namespace (http://issuerservice:8086, http://vault:8200, ...) and do not depend on the release name. If you rename a
# component, update the URLs that point to it.
#
# Credentials are never values: every component reads them from an existing Kubernetes Secret (see README.md).

# -- NetworkPolicies of the release namespace: default deny, then only the flows the components need.
networkPolicy:
  enabled: true
  # -- Namespace of the ingress controller that serves the public hosts.
  ingressControllerNamespace: ingress-nginx
  # -- DNS ports of kube-dns (some clusters also need the CoreDNS target port, e.g. 8053).
  dnsPorts: [53]
  # -- CIDRs of the public ingress load balancer: pods resolve and call the public hosts of this release
  # (did:web documents, IdP token endpoints) through it.
  publicIngressCidrs: []
  # -- Kubernetes API server CIDR, needed by the identity seed Job to write the generated keys into Secrets.
  apiServerCidr: ""
  # -- Additional egress rules for all pods (e.g. shared services in another namespace).
  extraEgress: []

# -- Test mail server: receives every mail of the Portal and the SharedIdP (no relay).
smtp4dev:
  enabled: true
  image: "docker.io/rnwood/smtp4dev:3.15.0@sha256:25c434c1900a9c5b61e17ead0a774d9e81b80554d05cf64719d69e5ea8c66537"
  storage:
    size: 1Gi
    storageClassName: ""

# -- In-cluster did:web resolver for the Portal (uni-resolver driver behind an nginx allow-list gateway).
didResolver:
  enabled: true
  # -- Only did:web identifiers under this DNS domain are resolved.
  didWebDomain: example.org
  gatewayImage: "docker.io/nginxinc/nginx-unprivileged:1.28.0-alpine@sha256:c97ff0bf7cbae369953c6da1232ec14ad9f971d66360c5698db0856a4cd657a0"
  driverImage: "docker.io/uport/uni-resolver-driver-did-uport:5.0.8@sha256:917f4d1aab9165f1b91dedba6dd86d6662771018f137b93722b4d4f4bc729356"

# -- Static HTTP data source used as the asset of the EDC end-to-end test.
edcDatasource:
  enabled: true
  image: "docker.io/nginxinc/nginx-unprivileged:1.27-alpine@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0"

# -- One-time setup of IssuerService and IdentityHub through their APIs: issuer participant, attestations, credential
# definitions, the Portal participant and its scoped API keys (written into portal.backend.processesworker.identityHub
# .existingSecret) and rotation of both super-user keys. Enable it only after Vault is initialised, unsealed and
# configured (hack/identity-vault.py). Issuer DID, issuer participant, definition ids and Secret names are taken from
# the portal, issuerservice and identityhub values. A new runId runs it again; every run rotates the Portal keys, so
# restart the Portal backend afterwards.
identitySeed:
  enabled: false
  runId: "1"
  image: "docker.io/alpine/k8s:1.31.3@sha256:7f485a380b3b890b8f4d0de63e242b79db728ef1e0fc5ae30d30cbe5f9e2d242"
  # -- IdentityHub participant used by the Portal (role admin, needed to read holder credentials).
  portalParticipantId: portal-provisioner
  credentialSchemaBaseUrl: "https://raw.githubusercontent.com/eclipse-tractusx/tractusx-profiles/main/cx/credentials"

portal:
  enabled: true
  fullnameOverride: portal
  keepSecretsOnUninstall: true
  portalAddress: "https://portal.example.org"
  portalBackendAddress: "https://portal-backend.example.org"
  centralidp:
    address: "https://centralidp.example.org"
  sharedidpAddress: "https://sharedidp.example.org"
  semanticsAddress: "https://semantics.example.org"
  bpdm:
    poolAddress: "https://business-partners.example.org"
    poolApiPath: "/pool/v6"
    portalGateAddress: "https://business-partners.example.org"
    portalGateApiPath: "/gate/v6"
  sdfactoryAddress: "https://sdfactory.example.org"
  bpnDidResolver:
    managementApiAddress: "http://bdrs:8081"
    directoryApiAddress: "http://bdrs:8082/api/directory"
    existingSecret: portal-bdrs
    existingSecretKey: management-api-key
  # Not used with the IdentityHub wallet provider.
  custodianAddress: "https://custodian.disabled.invalid"
  issuerComponentAddress: "https://ssi-credential-issuer.disabled.invalid"
  dimWrapper:
    baseAddress: "https://dim.disabled.invalid"
    tokenAddress: "https://dim.disabled.invalid/token"
  decentralIdentityManagementAuthAddress: "https://dim.disabled.invalid/sts"
  clearinghouse:
    default:
      baseAddress: "https://clearinghouse.disabled.invalid"
      tokenAddress: "https://clearinghouse.disabled.invalid/token"
      clearinghouseConnectDisabled: true
  frontend:
    ingress:
      enabled: true
      name: "frontend"
      className: "nginx"
      annotations:
        nginx.ingress.kubernetes.io/rewrite-target: "/$1"
        nginx.ingress.kubernetes.io/use-regex: "true"
      tls:
        - secretName: "portal-frontend-tls"
          hosts:
            - "portal.example.org"
      hosts:
        - host: "portal.example.org"
          paths:
            - path: "/(.*)"
              pathType: "ImplementationSpecific"
              backend:
                service: "portal"
                port: 8080
            - path: "/registration/(.*)"
              pathType: "ImplementationSpecific"
              backend:
                service: "registration"
                port: 8080
            - path: "/((assets|documentation)/.*)"
              pathType: "ImplementationSpecific"
              backend:
                service: "assets"
                port: 8080
    portal:
      image:
        name: "docker.io/tractusx/portal-frontend"
        portaltag: "v2.6.0@sha256:d0fe6dd295603fa8489b7af04179df1e80ae60246f0a6922957c1db5df395b95"
    registration:
      image:
        name: "docker.io/tractusx/portal-frontend-registration"
        registrationtag: "v2.2.2@sha256:36bf200b4b64becab2606c60121ad59cd145492907e35cf86b208ad1bc22269a"
    assets:
      image:
        name: "docker.io/tractusx/portal-assets"
        assetstag: "v2.6.0@sha256:27cf6ef97e1d9710b4440b964bfe92e0ceba1fffb139b3924066ba576bb3dbc3"
  backend:
    ingress:
      enabled: true
      name: "backend"
      className: "nginx"
      annotations:
        nginx.ingress.kubernetes.io/use-regex: "true"
        nginx.ingress.kubernetes.io/enable-cors: "true"
        nginx.ingress.kubernetes.io/proxy-body-size: "8m"
        nginx.ingress.kubernetes.io/cors-allow-origin: "https://portal.example.org"
      tls:
        - secretName: "portal-backend-tls"
          hosts:
            - "portal-backend.example.org"
      hosts:
        - host: "portal-backend.example.org"
          paths:
            - path: "/api/registration"
              pathType: "Prefix"
              backend:
                service: "registration-service"
                port: 8080
            - path: "/api/administration"
              pathType: "Prefix"
              backend:
                service: "administration-service"
                port: 8080
            - path: "/api/notification"
              pathType: "Prefix"
              backend:
                service: "notification-service"
                port: 8080
            - path: "/api/apps"
              pathType: "Prefix"
              backend:
                service: "marketplace-app-service"
                port: 8080
            - path: "/api/services"
              pathType: "Prefix"
              backend:
                service: "services-service"
                port: 8080
    walletProvider: IdentityHub
    keycloak:
      secret: portal-keycloak
      central:
        clientId: "sa-cl1-reg-2"
        clientSecret: ""
        jwtBearerOptions:
          requireHttpsMetadata: "true"
      shared:
        clientId: "sa-cl1-reg-1"
        clientSecret: ""
    mailing:
      secret: portal-mailing
      host: "smtp4dev"
      port: "25"
      user: "portal"
      senderEmail: "noreply@example.org"
      password: ""
    interfaces:
      secret: portal-interfaces
    provisioning:
      sharedRealm:
        smtpServer:
          host: "smtp4dev"
          port: "25"
          user: ""
          password: ""
          from: "noreply@example.org"
          replyTo: "noreply@example.org"
          auth: "false"
          startTls: "false"
    # Backend images are ARENA2036 builds of portal-backend (IdentityHub wallet provider), pinned by digest.
    administration:
      image:
        name: "harbor-hub-shared.arena.3ascloud.de/be293/portal-administration-service"
        administrationservicetag: "be293-274096a965c10d65a96d8c077a60b7680176aff7@sha256:aff600f9fc558c1d651e124d0c7b43b90819b94b6971967b9d4661c57cd76560"
        pullSecrets: &pullSecrets
          - name: portal-registry-pull
      issuerdid: "did:web:issuer.example.org:BPNL00000003CRHK"
      connectorProvisioning:
        connectorLocationId: DE
        devOperatorRequestsEnabled: false
    registration:
      image:
        name: "harbor-hub-shared.arena.3ascloud.de/be293/portal-registration-service"
        registrationservicetag: "be293-ad459ee711ecaa9a43535a513bd9db83b640a8ff@sha256:a83cf1410c0d762f407b189eed8fe9e78e72bc91abbd2ec2eed727c0a8d93088"
        pullSecrets: *pullSecrets
    appmarketplace:
      image:
        name: "harbor-hub-shared.arena.3ascloud.de/be293/portal-marketplace-app-service"
        appmarketplaceservicetag: "be293-ad459ee711ecaa9a43535a513bd9db83b640a8ff@sha256:2d5c3f6b208c53be33afeb03db5cf28479436f7aa263853374ecc262a758e94b"
        pullSecrets: *pullSecrets
    services:
      image:
        name: "harbor-hub-shared.arena.3ascloud.de/be293/portal-services-service"
        servicesservicetag: "be293-ad459ee711ecaa9a43535a513bd9db83b640a8ff@sha256:2abb07a918dd00cc9eded6f8fe9d15d6f7af137a26daf9a9b586744b98ba8b81"
        pullSecrets: *pullSecrets
    notification:
      image:
        name: "harbor-hub-shared.arena.3ascloud.de/be293/portal-notification-service"
        notificationservicetag: "be293-ad459ee711ecaa9a43535a513bd9db83b640a8ff@sha256:982e77752e05d341bb21dc708037423f7e1d2eed439999c891223dd61efb8b43"
        pullSecrets: *pullSecrets
    portalmaintenance:
      # Never delete data automatically.
      suspend: true
      image:
        name: "harbor-hub-shared.arena.3ascloud.de/be293/portal-maintenance-service"
        portalmaintenancetag: "be293-ad459ee711ecaa9a43535a513bd9db83b640a8ff@sha256:08ee4b36da69c993094a47732aee8b18d0aec3a9defb368a12f0e6a622f559ee"
        pullSecrets: *pullSecrets
      batchProcessing:
        deleteDocuments:
          days: 365000
        retriggerClearinghouse:
          days: 365000
    portalmigrations:
      image:
        name: "harbor-hub-shared.arena.3ascloud.de/be293/portal-migrations"
        portalmigrationstag: "be293-ad459ee711ecaa9a43535a513bd9db83b640a8ff@sha256:c10f64ca556b6089f1f01bcce0291a62ec9390cfe727650ff84d09f3863a3815"
        pullSecrets: *pullSecrets
      seeding:
        useInitial: true
        seedTestData:
          useDefault: false
          useOwnConfigMap:
            configMap: ""
            filename: ""
    provisioningmigrations:
      image:
        name: "docker.io/tractusx/portal-provisioning-migrations"
        provisioningmigrationstag: "v2.6.0@sha256:cbb0c469d5fc4af106a08a2fb8b9b5530877bf47e9698bff5bc0549e7e716992"
    processesworker:
      image:
        name: "harbor-hub-shared.arena.3ascloud.de/be293/portal-processes-worker"
        processesworkertag: "be293-e2451f87628c8ae56c131f136e5ad3e12703a1f6@sha256:0857101e376c52277f88ec081b2902e6883f530e6d27d914fc83d05d7e72d3a6"
        pullSecrets: *pullSecrets
      bpnDidResolver:
        apiKey: ""
      bpdm:
        clientId: "sa-cl7-cx-5"
        clientSecret: ""
        tokenAddress: ""
      sdfactory:
        clientId: "sa-cl8-cx-1"
        clientSecret: ""
      dim:
        baseAddress: "https://dim.disabled.invalid"
        universalResolverAddress: "http://did-resolver:8080/"
      identityHub:
        enabled: true
        baseAddress: "http://identityhub:8082/api/identity"
        credentialServiceBaseAddress: "https://identityhub.example.org/api/credentials"
        didDocumentBaseLocation: "identityhub.example.org"
        universalResolverAddress: "http://did-resolver:8080/"
        issuerDid: "did:web:issuer.example.org:BPNL00000003CRHK"
        issuerParticipantId: "issuer"
        issuerAdminBaseAddress: "http://issuerservice:8086/api/admin"
        bpnCredentialType: BpnCredential
        bpnCredentialDefinitionId: "BpnCredential-id"
        membershipCredentialType: MembershipCredential
        membershipCredentialDefinitionId: "membershipCredential-id"
        frameworkContractVersion: "1.0"
        maxValidationTimeInDays: 7
        # Keys identityhub-api-key and issuerservice-admin-api-key, written by the identity seed.
        existingSecret: portal-identityhub
        issuerAdminApiKeySecretKey: issuerservice-admin-api-key
        apiKey: ""
        issuerAdminApiKey: ""
  postgresql:
    enabled: true
    fullnameOverride: portal-postgresql
    architecture: standalone
    image:
      registry: docker.io
      repository: bitnamilegacy/postgresql
      tag: "15-debian-11"
      digest: "sha256:e5dd504985505a6e30b36a474a1764e9f93fd2367acf5d196dd14827cac7eac4"
    auth:
      existingSecret: portal-postgres
      externalSecretManaged: false
    primary:
      persistence:
        enabled: true
        size: 8Gi
      persistentVolumeClaimRetentionPolicy:
        enabled: true
        whenScaled: Retain
        whenDeleted: Retain
  externalDatabase:
    host: "portal-external-db.disabled.invalid"

centralidp:
  enabled: true
  keycloak:
    # The realm seeding Job reads the admin password from the Secret named like the Keycloak fullname.
    fullnameOverride: centralidp-keycloak
    auth:
      existingSecret: centralidp-keycloak
    production: true
    proxyHeaders: "xforwarded"
    ingress:
      enabled: true
      ingressClassName: "nginx"
      hostname: "centralidp.example.org"
      hostnameStrict: true
      annotations:
        nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
        nginx.ingress.kubernetes.io/proxy-buffering: "on"
        nginx.ingress.kubernetes.io/proxy-buffers-number: "20"
      tls: true
    postgresql:
      fullnameOverride: centralidp-postgresql
      auth:
        existingSecret: centralidp-postgres
      primary:
        persistence:
          enabled: true
  realmSeeding:
    clients:
      registration:
        redirects:
          - "https://portal.example.org/*"
      portal:
        rootUrl: "https://portal.example.org/home"
        redirects:
          - "https://portal.example.org/*"
      semantics:
        redirects:
          - "https://portal.example.org/*"
      existingSecret: centralidp-seeding-clients
    serviceAccounts:
      existingSecret: centralidp-seeding-service-accounts
    sharedidp: "https://sharedidp.example.org"

sharedidp:
  enabled: true
  keycloak:
    # The realm seeding Job reads the admin password from the Secret named like the Keycloak fullname.
    fullnameOverride: sharedidp-keycloak
    auth:
      existingSecret: sharedidp-keycloak
    production: true
    proxyHeaders: "xforwarded"
    ingress:
      enabled: true
      ingressClassName: "nginx"
      hostname: "sharedidp.example.org"
      hostnameStrict: true
      annotations:
        nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
        nginx.ingress.kubernetes.io/proxy-buffering: "on"
        nginx.ingress.kubernetes.io/proxy-buffers-number: "20"
      tls: true
    postgresql:
      fullnameOverride: sharedidp-postgresql
      auth:
        existingSecret: sharedidp-postgres
      primary:
        persistence:
          enabled: true
  realmSeeding:
    realms:
      cxOperator:
        centralidp: "https://centralidp.example.org"
        existingSecret: sharedidp-seeding-cx-operator
      master:
        existingSecret: sharedidp-seeding-master

# PostgreSQL of IssuerService, IdentityHub and BDRS: one database and one role per application.
identity-postgresql:
  enabled: true
  fullnameOverride: identity-postgresql
  image: &postgresImage
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: "15-debian-11"
    digest: "sha256:e5dd504985505a6e30b36a474a1764e9f93fd2367acf5d196dd14827cac7eac4"
  architecture: standalone
  auth:
    enablePostgresUser: true
    existingSecret: identity-postgresql
    secretKeys:
      adminPasswordKey: postgres-password
  primary:
    extraEnvVarsSecret: identity-db-users
    initdb:
      scripts:
        01-identity-databases.sql: |
          -- Never write a failed statement (which would contain a password) to the server log.
          SET log_min_error_statement = 'panic';
          SET log_statement = 'none';
          \getenv issuerservice_pw ISSUERSERVICE_DB_PASSWORD
          \getenv identityhub_pw IDENTITYHUB_DB_PASSWORD
          \getenv bdrs_pw BDRS_DB_PASSWORD
          CREATE ROLE issuerservice LOGIN PASSWORD :'issuerservice_pw';
          CREATE ROLE identityhub LOGIN PASSWORD :'identityhub_pw';
          CREATE ROLE bdrs LOGIN PASSWORD :'bdrs_pw';
          CREATE DATABASE issuerservice OWNER issuerservice;
          CREATE DATABASE identityhub OWNER identityhub;
          CREATE DATABASE bdrs OWNER bdrs;
          REVOKE ALL ON DATABASE issuerservice FROM PUBLIC;
          REVOKE ALL ON DATABASE identityhub FROM PUBLIC;
          REVOKE ALL ON DATABASE bdrs FROM PUBLIC;
    persistence: &postgresPersistence
      enabled: true
      size: 8Gi
      accessModes: [ReadWriteOnce]
    persistentVolumeClaimRetentionPolicy: &retain
      enabled: true
      whenDeleted: Retain
      whenScaled: Retain
    resources: &postgresResources
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    networkPolicy:
      enabled: false
  readReplicas:
    replicaCount: 0
  networkPolicy:
    enabled: false

# Vault of IssuerService, IdentityHub, BDRS and the test connectors: Raft storage, manual Shamir unseal
# (hack/identity-vault.py). One KV v2 mount, policy and periodic token per application.
vault:
  enabled: true
  fullnameOverride: vault
  injector:
    enabled: false
  csi:
    enabled: false
  ui:
    enabled: false
  server:
    enabled: true
    image:
      repository: "hashicorp/vault"
      tag: "1.18.1@sha256:3580fa352195aa7e76449cb8fadeef6d2f90a454c38982d30cf094e9013be786"
    dev:
      enabled: false
    standalone:
      enabled: false
    ha:
      enabled: true
      replicas: 1
      raft:
        enabled: true
        setNodeId: true
        config: |
          ui = false
          disable_mlock = true
          listener "tcp" {
            tls_disable = 1
            address = "[::]:8200"
            cluster_address = "[::]:8201"
          }
          storage "raft" {
            path = "/vault/data"
          }
      disruptionBudget:
        enabled: false
    dataStorage:
      enabled: true
      size: 2Gi
      accessMode: ReadWriteOnce
    auditStorage:
      enabled: false
    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain
    authDelegator:
      enabled: false
    serviceAccount:
      create: true
      serviceDiscovery:
        enabled: false
    service:
      enabled: true
      type: ClusterIP
    ingress:
      enabled: false
    route:
      enabled: false
    networkPolicy:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

issuerservice:
  enabled: true
  fullnameOverride: issuerservice
  install:
    postgresql: false
    vault: false
  pgadmin4:
    enabled: false
  issuerservice:
    image:
      repository: "tractusx/issuerservice"
      tag: "0.4.1@sha256:4fc515d6f7b31a04dabe31120cd0b7a8ae39f6b942eb17049dd5c99ca57f7d3e"
    didweb:
      https: true
    envValueFrom:
      edc.vault.hashicorp.token: {secretKeyRef: {name: issuerservice-vault-token, key: token}}
      edc.ih.api.superuser.key: {secretKeyRef: {name: issuerservice-superuser, key: api-key}}
      edc.datasource.attestationdefinitions.password: &issuerDbPassword {secretKeyRef: {name: identity-db-users, key: ISSUERSERVICE_DB_PASSWORD}}
      edc.datasource.credentialdefinitions.password: *issuerDbPassword
      edc.datasource.credentials.password: *issuerDbPassword
      edc.datasource.customattestations.password: *issuerDbPassword
      edc.datasource.didresource.password: *issuerDbPassword
      edc.datasource.holder.password: *issuerDbPassword
      edc.datasource.issuanceprocess.password: *issuerDbPassword
      edc.datasource.jti.password: *issuerDbPassword
      edc.datasource.keypair.password: *issuerDbPassword
      edc.datasource.participant.password: *issuerDbPassword
      edc.datasource.participantcontext.password: *issuerDbPassword
      edc.datasource.participantcontextconfig.password: *issuerDbPassword
      edc.datasource.stsclient.password: *issuerDbPassword
    ingresses:
      - enabled: true
        hostname: "issuer.example.org"
        endpoints:
          - did
          - issuance
          - statuslist
        className: "nginx"
        tls:
          enabled: true
          secretName: "issuerservice-tls"
    logging: &identityLogging
      handlers:
        - java.util.logging.ConsoleHandler
      persistence:
        enabled: false
    resources: &identityResources
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1.5"
        memory: 1Gi
  statuslist:
    callback:
      address: "https://issuer.example.org/statuslist"
  postgresql:
    jdbcUrl: "jdbc:postgresql://identity-postgresql:5432/issuerservice"
    auth:
      database: "issuerservice"
      username: "issuerservice"
      # Not rendered: envValueFrom sets the password from the Secret.
      password: "from-secret-ref"
  vault:
    hashicorp:
      url: "http://vault:8200"
      token: "from-secret-ref"
      paths:
        secret: /v1/issuerservice
        health: /v1/sys/health

identityhub:
  enabled: true
  fullnameOverride: identityhub
  install:
    postgresql: false
    vault: false
  identityhub:
    image:
      repository: "tractusx/identityhub"
      tag: "0.4.1@sha256:48b47c05c6292ab0d81d59203c408044edd0d1b9c383e96ab2b67ef6b85fc8a0"
    endpoints:
      identity:
        port: 8082
        path: /api/identity
        # A Vault alias name, not a secret.
        authKeyAlias: "identity-api-auth"
    didweb:
      https: true
    iatp:
      sts:
        oauth:
          client:
            # No pre-configured participant: the Portal creates the holders.
            enabled: false
            id: "unused"
            secret: "unused"
            secret_alias: "unused"
            x_api_key: "unused"
    envValueFrom:
      edc.vault.hashicorp.token: {secretKeyRef: {name: identityhub-vault-token, key: token}}
      edc.ih.api.superuser.key: {secretKeyRef: {name: identityhub-superuser, key: api-key}}
      edc.datasource.credentialrequest.password: &identityhubDbPassword {secretKeyRef: {name: identity-db-users, key: IDENTITYHUB_DB_PASSWORD}}
      edc.datasource.credentials.password: *identityhubDbPassword
      edc.datasource.didresource.password: *identityhubDbPassword
      edc.datasource.jti.password: *identityhubDbPassword
      edc.datasource.keypair.password: *identityhubDbPassword
      edc.datasource.participantcontext.password: *identityhubDbPassword
      edc.datasource.participantcontextconfig.password: *identityhubDbPassword
      edc.datasource.stsclient.password: *identityhubDbPassword
    ingresses:
      - enabled: true
        hostname: "identityhub.example.org"
        endpoints:
          - credentials
          - did
        className: "nginx"
        tls:
          enabled: true
          secretName: "identityhub-tls"
    logging: *identityLogging
    resources: *identityResources
  postgresql:
    jdbcUrl: "jdbc:postgresql://identity-postgresql:5432/identityhub"
    auth:
      database: "identityhub"
      username: "identityhub"
      password: "from-secret-ref"
  vault:
    hashicorp:
      url: "http://vault:8200"
      token: "from-secret-ref"
      paths:
        secret: /v1/identityhub
        health: /v1/sys/health

bdrs:
  enabled: true
  fullnameOverride: bdrs
  install:
    postgresql: false
    vault: false
  server:
    image:
      repository: "tractusx/bdrs-server"
      tag: "0.6.0@sha256:e73c566f3b20f9e0f3db21d6e49911d01fe22fd4c01f463e2a52e26914cfd206"
    trustedIssuers:
      - "did:web:issuer.example.org:BPNL00000003CRHK"
    envValueFrom:
      EDC_VAULT_HASHICORP_TOKEN: {secretKeyRef: {name: bdrs-vault-token, key: token}}
    ingresses:
      - enabled: false
        hostname: "bdrs-server.directory.local"
        endpoints:
          - directory
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
  # BDRS reads its database user, password and management API key from Vault (mount bdrs).
  postgresql:
    jdbcUrl: "jdbc:postgresql://identity-postgresql:5432/bdrs"
  vault:
    hashicorp:
      url: "http://vault:8200"
      token: "from-secret-ref"
      paths:
        secret: /v1/bdrs
        health: /v1/sys/health

# PostgreSQL of the two test connectors.
edc-postgresql:
  enabled: true
  fullnameOverride: edc-postgresql
  image: *postgresImage
  architecture: standalone
  auth:
    enablePostgresUser: true
    existingSecret: edc-postgresql
    secretKeys:
      adminPasswordKey: postgres-password
  primary:
    extraEnvVarsSecret: edc-db-users
    initdb:
      scripts:
        01-edc-databases.sql: |
          -- Never write a failed statement (which would contain a password) to the server log.
          SET log_min_error_statement = 'panic';
          SET log_statement = 'none';
          \getenv edc_provider_pw EDC_PROVIDER_DB_PASSWORD
          \getenv edc_consumer_pw EDC_CONSUMER_DB_PASSWORD
          CREATE ROLE edc_provider LOGIN PASSWORD :'edc_provider_pw';
          CREATE ROLE edc_consumer LOGIN PASSWORD :'edc_consumer_pw';
          CREATE DATABASE edc_provider OWNER edc_provider;
          CREATE DATABASE edc_consumer OWNER edc_consumer;
          REVOKE ALL ON DATABASE edc_provider FROM PUBLIC;
          REVOKE ALL ON DATABASE edc_consumer FROM PUBLIC;
    persistence:
      <<: *postgresPersistence
      size: 4Gi
    persistentVolumeClaimRetentionPolicy: *retain
    resources: *postgresResources
    networkPolicy:
      enabled: false
  readReplicas:
    replicaCount: 0
  networkPolicy:
    enabled: false

# Test connectors (DCP with IdentityHub and the IssuerService as trusted issuer). Both participants are onboarded
# through the Portal first; hack/identity-vault.py configure-edc then gives each one its Vault mount and keys.
edc-provider:
  enabled: true
  fullnameOverride: edc-provider
  install: &edcInstall
    postgresql: false
    vault: false
  participant:
    id: "did:web:identityhub.example.org:BPNL000000000FV1"
    bpnl: "BPNL000000000FV1"
    # IdentityHub participantContextId (plain, as created by the Portal).
    contextId: "bpnl000000000fv1"
  dcp:
    trustedIssuers: &edcTrustedIssuers
      - "did:web:issuer.example.org:BPNL00000003CRHK"
    sts:
      div:
        url: ""
      oauth:
        token_url: "http://identityhub:8087/api/sts/token"
        client:
          # STS client_id = the participant DID.
          id: "did:web:identityhub.example.org:BPNL000000000FV1"
          secret_alias: "edc-wallet-secret"
  controlplane: &edcControlplane
    policy:
      validation:
        enabled: false
    image:
      repository: "tractusx/edc-controlplane-postgresql-hashicorp-vault"
      tag: "0.13.0@sha256:9de9ceeedf4d5cee918901fd1244b09675c387f638800ea69302cbb2bb2cc7b9"
    # The images expect a writable /app/configuration.properties; the root filesystem is read-only.
    initContainers:
      - name: initialize-runtime-configuration
        image: "docker.io/tractusx/edc-controlplane-postgresql-hashicorp-vault:0.13.0@sha256:9de9ceeedf4d5cee918901fd1244b09675c387f638800ea69302cbb2bb2cc7b9"
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-ec", "umask 0077; : > /work/configuration.properties"]
        securityContext: &edcInitSecurity
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
        volumeMounts: [{name: edc-runtime-configuration, mountPath: /work}]
    volumeMounts: &edcRuntimeConfigMount
      - {name: edc-runtime-configuration, mountPath: /app/configuration.properties, subPath: configuration.properties}
    volumes: &edcRuntimeConfigVolume
      - {name: edc-runtime-configuration, emptyDir: {sizeLimit: 1Mi}}
    bdrs:
      server:
        url: "http://bdrs:8082/api/directory"
    resources: &edcResources
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1.5"
        memory: 1Gi
    endpoints:
      management:
        # Not rendered: authKeySecretRef is the only source.
        authKey: "from-secret-ref"
        authKeySecretRef: {name: edc-provider-auth, key: management-api-key}
    url:
      protocol: "http://edc-provider-controlplane:8084"
    env: &edcProviderCredentialService
      TX_EDC_IAM_DCP_CREDENTIALSERVICE_URL: "http://identityhub:8083/api/credentials/v1/participants/bpnl000000000fv1"
      TX_IAM_IATP_CREDENTIALSERVICE_URL: "http://identityhub:8083/api/credentials/v1/participants/bpnl000000000fv1"
  dataplane: &edcDataplane
    image:
      repository: "tractusx/edc-dataplane-hashicorp-vault"
      tag: "0.13.0@sha256:de22ff97df715244de7c04784ee3fe6f08d369064186da675dcaffda63b5062c"
    initContainers:
      - name: initialize-runtime-configuration
        image: "docker.io/tractusx/edc-dataplane-hashicorp-vault:0.13.0@sha256:de22ff97df715244de7c04784ee3fe6f08d369064186da675dcaffda63b5062c"
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-ec", "umask 0077; : > /work/configuration.properties"]
        securityContext: *edcInitSecurity
        volumeMounts: [{name: edc-runtime-configuration, mountPath: /work}]
    volumeMounts: *edcRuntimeConfigMount
    volumes: *edcRuntimeConfigVolume
    token:
      signer:
        privatekey_alias: "tokenSignerPrivateKey"
      verifier:
        publickey_alias: "tokenSignerPublicKey"
    resources: *edcResources
    endpoints:
      proxy:
        authKey: "from-secret-ref"
        authKeySecretRef: {name: edc-provider-auth, key: proxy-api-key}
    url:
      public: "http://edc-provider-dataplane:8081/api/public"
    env: *edcProviderCredentialService
  postgresql:
    jdbcUrl: "jdbc:postgresql://edc-postgresql:5432/edc_provider"
    auth:
      username: "edc_provider"
      password: "from-secret-ref"
      passwordSecretRef: {name: edc-db-users, key: EDC_PROVIDER_DB_PASSWORD}
  vault:
    hashicorp:
      url: "http://vault:8200"
      token: "from-secret-ref"
      tokenSecretRef: {name: edc-provider-vault-token, key: token}
      paths:
        secret: /v1/edc-provider
        health: /v1/sys/health
        folder: ""
  networkPolicy:
    enabled: false

