---
portal:
  enabled: false
  replicaCount: 1
  postgresql:
    ## TEMPORARILY UNTIL NEW PORTAL UPDATE
    enabled: true
    image:
      registry: docker.io
      repository: bitnamilegacy/postgresql
      tag: "15-debian-11"
    commonLabels:
      app.kubernetes.io/version: "15"
    ## UNTIL HERE
    nameOverride: "portal-backend-postgresql"
    architecture: standalone
    auth:
      password: "dbpasswordportal"
      portalPassword: "dbpasswordportal"
      replicationPassword: "dbpasswordportal"
      provisioningPassword: "dbpasswordportal"
    primary:
      persistence:
        enabled: true
  portalAddress: "https://portal.txcd.arena2036-x.de"
  portalBackendAddress: "https://portal-backend.txcd.arena2036-x.de"
  centralidp:
    address: "https://centralidp.txcd.arena2036-x.de"
  sharedidpAddress: "https://sharedidp.txcd.arena2036-x.de"
  semanticsAddress: "https://semantics.txcd.arena2036-x.de"
  bpdm:
    poolAddress: "https://business-partners.txcd.arena2036-x.de"
    poolApiPath: "/pool/v6"
    portalGateAddress: "https://business-partners.txcd.arena2036-x.de"
    portalGateApiPath: "/gate/v6"
  custodianAddress: "https://ssi-dim-wallet-stub.txcd.arena2036-x.de"
  dimWrapper:
    baseAddress: "https://ssi-dim-wallet-stub.txcd.arena2036-x.de"
    apiPath: "/api/dim"
    tokenAddress: "https://ssi-dim-wallet-stub.txcd.arena2036-x.de/oauth/token"
  decentralIdentityManagementAuthAddress: "https://ssi-dim-wallet-stub.txcd.arena2036-x.de/api/sts"
  sdfactoryAddress: "https://sdfactory.txcd.arena2036-x.de"
  # -- no configuration for clearinghouse because it's an external component
  clearinghouse:
    default:
      baseAddress: "https://validation.txcd.arena2036-x.de"
      # -- clientId and clientSecret aren't in the centralidp Keycloak
      clientId: "clearinghouse-client-id-default"
      clientSecret: ""
      tokenAddress: "https://someiam.txcd.arena2036-x.de/realms/example/protocol/openid-connect/token"
      # -- if set to true the self description document creation will be skipped for company registrations as well as connector registrations
      clearinghouseConnectDisabled: true
  issuerComponentAddress: "https://ssi-credential-issuer.txcd.arena2036-x.de"
  frontend:
    portal:
      image:
        name: "harbor-hub-shared.arena.3ascloud.de/arena2036/portal-frontend"
        portaltag: "latest"
        pullPolicy: "Always"
        pullSecrets:
          - name: harbor-creds
    resources:
      requests:
        cpu: 25m
        memory: 125M
      limits:

        cpu: 75m
        memory: 125M
    assets:
      image:
        name: "harbor-hub-shared.arena.3ascloud.de/arena2036/portal-assets"
        assetstag: "latest"
        pullPolicy: "Always"
        pullSecrets:
          - name: harbor-creds
      resources:
        requests:
          cpu: 25m
          memory: 100M
        limits:
          cpu: 45m
          memory: 100M
    ingress:
      enabled: true
      className : "nginx"
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        nginx.ingress.kubernetes.io/rewrite-target: "/$1"
        nginx.ingress.kubernetes.io/use-regex: "true"
        nginx.ingress.kubernetes.io/enable-cors: "true"
        nginx.ingress.kubernetes.io/cors-allow-origin: "https://*.txcd.arena2036-x.de"
      tls:
        # -- Provide tls secret.
        - secretName: "portal.staging-tls"
          # -- Provide host for tls secret.
          hosts:
            - "portal.txcd.arena2036-x.de"
      hosts:
        - host: "portal.txcd.arena2036-x.de"
          paths:
            - path: "/(.*)"
              pathType: "ImplementationSpecific"
              backend:
                service: "portal"
                port: 8080
            - path: "/registration/(.*)"
              pathType: "ImplementationSpecific"
              backend:
                service: "registration"
                port: 8080
            - path: "/((assets|documentation)/.*)"
              pathType: "ImplementationSpecific"
              backend:
                service: "assets"
                port: 8080
  backend:
    dotnetEnvironment: "Development"
    useDimWallet: true
    keycloak:
      central:
        clientId: "sa-cl1-reg-2"
        clientSecret: "changeme"
        jwtBearerOptions:
          requireHttpsMetadata: "false"
      shared:
        clientId: "sa-cl1-reg-1"
        clientSecret: "changeme"
    registration:
      logging:
        default: "Debug"
        bpdmLibrary: "Debug"
        registrationService: "Debug"
      swaggerEnabled: true
    administration:
      logging:
        default: "Debug"
        businessLogic: "Debug"
        sdfactoryLibrary: "Debug"
        bpdmLibrary: "Debug"
        custodianLibrary: "Debug"
      serviceAccount:
        encryptionConfigs:
          index0:
            encryptionKey: "deb8261ec7b89c344f1c5ef5a11606e305f14e0d231b1357d90ad0180c5081d3"
      issuerdid: "did:web:ssi-dim-wallet-stub.txcd.arena2036-x.de:BPNL00000003CRHK"
      swaggerEnabled: true
    appmarketplace:
      logging:
        default: "Debug"
        offersLibrary: "Debug"
      swaggerEnabled: true
    services:
      logging:
        default: "Debug"
        offersLibrary: "Debug"
      swaggerEnabled: true
    notification:
