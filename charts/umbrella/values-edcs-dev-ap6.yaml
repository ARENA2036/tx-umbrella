        mountPath: /opt/bitnami/keycloak/themes/catenax-central
    initContainers:
      - name: import
        image: harbor-hub-shared.arena.3ascloud.de/arena2036/portal-iam:latest-v2
        imagePullPolicy: Always
        command:
          - sh
        args:
          - -c
          - |
            echo "Copying themes..."
            cp -R /import/themes/catenax-central/* /themes
        volumeMounts:
          - name: themes
            mountPath: /themes
    imagePullSecrets:
      - name: harbor-creds        
    ingress:
      enabled: true
      ingressClassName: "nginx"
      hostname: "centralidp.txcd.arena2036-x.de"
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
        nginx.ingress.kubernetes.io/cors-allow-methods: "PUT, GET, POST, OPTIONS"
        nginx.ingress.kubernetes.io/cors-allow-origin: "https://centralidp.txcd.arena2036-x.de"
        nginx.ingress.kubernetes.io/enable-cors: "true"
        nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
        nginx.ingress.kubernetes.io/proxy-buffering: "on"
        nginx.ingress.kubernetes.io/proxy-buffers-number: "20"
        nginx.ingress.kubernetes.io/use-regex: "true"
