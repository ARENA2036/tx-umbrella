            paths:
              - path: "/semantics/registry(/|$)(.*)"
                pathType: "Prefix"

    postgresql:
      fullnameOverride: "digital-twin-db"

semantic-hub:
  enabled: false
  enableKeycloak: false
  keycloak:
    postgresql:
      architecture: standalone
      primary:
        persistence:
          enabled: true
  hub:
    authentication: true
    idpIssuerUri: "https://centralidp.txcd.arena2036-x.de/auth/realms/CX-Central"
    idpClientId: Cl3-CX-Semantic
    embeddedTripleStore: true
    livenessProbe:
      initialDelaySeconds: 200
    readinessProbe:
      initialDelaySeconds: 200
    host: semantics.txcd.arena2036-x.de
    ingress:
      enabled: true
      tls: true
      urlPrefix: "/hub"
      className: "nginx"
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        nginx.ingress.kubernetes.io/rewrite-target: "/$2"
        nginx.ingress.kubernetes.io/use-regex: "true"
        nginx.ingress.kubernetes.io/enable-cors: "true"
        nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
        nginx.ingress.kubernetes.io/x-forwarded-prefix: "/hub"
  graphdb:
    enabled: true
    image: jena-fuseki-docker:5.0.0
    imagePullPolicy: Never
    storageClassName: ""
    storageSize: 8Gi

