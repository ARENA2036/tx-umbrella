dataconsumerOne:
  enabled: false
  seedTestdata: false
  nameOverride: dataconsumer
  secrets:
    edc-wallet-secret: changeme
  dataspace-connector-bundle:
    tractusx-connector:
      nameOverride: dataconsumer-edc
      participant:
        id: BPNL00000003AZQP
      iatp:
        id: did:web:ssi-dim-wallet-stub.txcd.arena2036-x.de:BPNL00000003AZQP
        trustedIssuers:
          - did:web:ssi-dim-wallet-stub.txcd.arena2036-x.de:BPNL00000003CRHK
        sts:
          dim:
            url: https://ssi-dim-wallet-stub.txcd.arena2036-x.de/api/sts
          oauth:
            token_url: https://ssi-dim-wallet-stub.txcd.arena2036-x.de/oauth/token
            client:
              id: BPNL00000003AZQP
              secret_alias: edc-wallet-secret
      controlplane:
        env:
          TX_IAM_IATP_CREDENTIALSERVICE_URL: https://ssi-dim-wallet-stub.txcd.arena2036-x.de/api
          EDC_IAM_DID_WEB_USE_HTTPS: false
        bdrs:
          server:
            url: https://ssi-dim-wallet-stub.txcd.arena2036-x.de/api/v1/directory
        endpoints:
          management:
            authKey: TEST1
        ingresses:
          - enabled: true
            hostname: "dataconsumer-controlplane.txcd.arena2036-x.de"
            endpoints:
              - default
              - protocol
              - management
            className: "nginx"
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
            tls:
              enabled: true
      dataplane:
        env:
          TX_IAM_IATP_CREDENTIALSERVICE_URL: https://ssi-dim-wallet-stub.txcd.arena2036-x.de/api
          EDC_IAM_DID_WEB_USE_HTTPS: false
        ingresses:
          - enabled: true
            hostname: "dataconsumer-dataplane.txcd.arena2036-x.de"
            endpoints:
              - default
              - public
            className: "nginx"
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
            tls:
              enabled: true
        token:
          signer:
            privatekey_alias: tokenSignerPrivateKey
          verifier:
            publickey_alias: tokenSignerPublicKey
      postgresql:
        jdbcUrl: "jdbc:postgresql://{{ .Release.Name }}-dataconsumer-db:5432/edc"
        auth:
          password: "dbpassworddataconsumerone"
          postgresPassword: "dbpassworddataconsumerone"
      vault:
        hashicorp:
          url: http://{{ .Release.Name }}-edc-dataconsumer-vault:8200

    postgresql:
      nameOverride: dataconsumer-db
      auth:
        password: "dbpassworddataconsumerone"
        postgresPassword: "dbpassworddataconsumerone"

    vault:
      nameOverride: edc-dataconsumer-vault
      enabled: true

  data-persistence-layer-bundle:
    enabled: false

  digital-twin-bundle:
    enabled: false

