                service: "provisioning-service"
                port: 8080
            - path: "/api/apps"
              pathType: "Prefix"
              backend:
                service: "marketplace-app-service"
                port: 8080
            - path: "/api/services"
              pathType: "Prefix"
              backend:
                service: "services-service"
                port: 8080

## use the centralidp and sharedidp from the central release25.09 in prod cluster
centralidp:
  enabled: false
  # -- uncomment the following for persistance
  # keycloak:
  #   postgresql:
  #     primary:
  #       persistence:
  #         enabled: true

sharedidp:
  enabled: false
  # -- uncomment the following for persistance
  # keycloak:
  #   postgresql:
  #     primary:
  #       persistence:
  #         enabled: true

pgadmin4:
  enabled: true
  # -- uncomment the following for persistance
  # persistentVolume:
  #   enabled: true

# Interfaces are disabled by default (other than IAM)

# Set 'enabled' to true if onboarding is required
bpdm:
  enabled: false

bdrs-server-memory:
  enabled: false

# Set 'enabled' to true if onboarding is required
selfdescription:
  enabled: false

# Set 'enabled' to true if onboarding is required
smtp4dev:
  enabled: false

bpndiscovery:
  enabled: false

discoveryfinder:
  enabled: false

# Set 'enabled' to true if onboarding is required
ssi-credential-issuer:
  enabled: false

# Set 'enabled' to true if onboarding is required
identity-and-trust-bundle:
  enabled: false
  # -- uncomment the following for persistance
  # postgresql:
  #   primary:
  #     persistence:
