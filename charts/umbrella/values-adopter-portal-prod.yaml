---

portal:
  enabled: true
  replicaCount: 1
  postgresql:
    ## TEMPORALY UNTIL NEW PORTAL UPDATE
    enabled: true
    image:
      registry: docker.io
      repository: bitnamilegacy/postgresql
      tag: "15-debian-11"
    commonLabels:
      app.kubernetes.io/version: "15"
    ## UNTIL HERE
    nameOverride: "portal-backend-dev-postgresql"
    architecture: standalone
    dbName: postgres
    dbPort: 5432
    auth:
      dbUser: postgres
      password: "dbpasswordportal"
      portalPassword: "dbpasswordportal"
      replicationPassword: "dbpasswordportal"
      provisioningPassword: "dbpasswordportal"
    primary:
      persistence:
        enabled: true
  portalAddress: "https://portal-dev.prod.arena2036-x.de"
  portalBackendAddress: "https://portal-backend-dev.prod.arena2036-x.de"
  centralidp:
    address: "https://centralidp.prod.arena2036-x.de"
  sharedidpAddress: "https://sharedidp.prod.arena2036-x.de"
  semanticsAddress: "https://semantics.prod.arena2036-x.de"
  bpdm:
    poolAddress: "https://business-partners.prod.arena2036-x.de"
    poolApiPath: "/pool/v6"
    portalGateAddress: "https://business-partners.prod.arena2036-x.de"
    portalGateApiPath: "/gate/v6"
  custodianAddress: "https://ssi-dim-wallet-stub.prod.arena2036-x.de"
  dimWrapper:
    baseAddress: "https://ssi-dim-wallet-stub.prod.arena2036-x.de"
    apiPath: "/api/dim"
    tokenAddress: "https://ssi-dim-wallet-stub.prod.arena2036-x.de/oauth/token"
  decentralIdentityManagementAuthAddress: "https://ssi-dim-wallet-stub.prod.arena2036-x.de/api/sts"
  sdfactoryAddress: "https://sdfactory.prod.arena2036-x.de"
  # -- no configuration for clearinghouse because it's an external component
  clearinghouse:
    default:
      baseAddress: "https://validation.prod.arena2036-x.de"
      # -- clientId and clientSecret aren't in the centralidp Keycloak
      clientId: "clearinghouse-client-id-default"
      clientSecret: ""
      tokenAddress: "https://someiam.prod.arena2036-x.de/realms/example/protocol/openid-connect/token"
      # -- if set to true the self description document creation will be skipped for company registrations as well as connector registrations
      clearinghouseConnectDisabled: true
  issuerComponentAddress: "https://ssi-credential-issuer.prod.arena2036-x.de"
  frontend:
    portal:
      image:
        name: "harbor-hub-shared.arena.3ascloud.de/arena2036/portal-frontend"
        portaltag: "11032026-latest"
        pullPolicy: "Always"
        pullSecrets:
          - name: harbor-creds
    resources:
      requests:
        cpu: 25m
        memory: 125M
      limits:

        cpu: 75m
        memory: 125M
    assets:
      image:
        name: "harbor-hub-shared.arena.3ascloud.de/arena2036/portal-assets"
        assetstag: "latest"
        pullPolicy: "Always"
        pullSecrets:
          - name: harbor-creds
      resources:
        requests:
          cpu: 25m
          memory: 100M
        limits:
          cpu: 45m
          memory: 100M
    ingress:
      enabled: true
      className : "nginx"
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        nginx.ingress.kubernetes.io/rewrite-target: "/$1"
        nginx.ingress.kubernetes.io/use-regex: "true"
        nginx.ingress.kubernetes.io/enable-cors: "true"
        nginx.ingress.kubernetes.io/cors-allow-origin: "https://*.prod.arena2036-x.de"
      tls:
        # -- Provide tls secret.
        - secretName: "portal-dev.prod-tls"
          # -- Provide host for tls secret.
          hosts:
            - "portal-dev.prod.arena2036-x.de"
      hosts:
        - host: "portal-dev.prod.arena2036-x.de"
          paths:
            - path: "/(.*)"
              pathType: "ImplementationSpecific"
              backend:
                service: "portal"
                port: 8080
            - path: "/registration/(.*)"
              pathType: "ImplementationSpecific"
              backend:
                service: "registration"
                port: 8080
            - path: "/((assets|documentation)/.*)"
              pathType: "ImplementationSpecific"
              backend:
                service: "assets"
                port: 8080
  backend:
    dotnetEnvironment: "Development"
    useDimWallet: true
    keycloak:
      central:
        clientId: "sa-cl1-reg-2"
        clientSecret: "changeme"
        jwtBearerOptions:
          requireHttpsMetadata: "false"
      shared:
        clientId: "sa-cl1-reg-1"
        clientSecret: "changeme"
    registration:
      logging:
        default: "Debug"
        bpdmLibrary: "Debug"
        registrationService: "Debug"
      swaggerEnabled: true
    administration:
      logging:
        default: "Debug"
        businessLogic: "Debug"
        sdfactoryLibrary: "Debug"
        bpdmLibrary: "Debug"
        custodianLibrary: "Debug"
      serviceAccount:
        encryptionConfigs:
          index0:
            encryptionKey: "deb8261ec7b89c344f1c5ef5a11606e305f14e0d231b1357d90ad0180c5081d3"
      issuerdid: "did:web:ssi-dim-wallet-stub.prod.arena2036-x.de:BPNL00000003CRHK"
      swaggerEnabled: true
    appmarketplace:
      logging:
        default: "Debug"
        offersLibrary: "Debug"
      swaggerEnabled: true
    services:
      logging:
        default: "Debug"
        offersLibrary: "Debug"
      swaggerEnabled: true
    notification:
      logging:
        default: "Debug"
      swaggerEnabled: true
    processesworker:
      clearinghouseConnectDisabled: true
      logging:
        default: "Debug"
        processesLibrary: "Debug"
        bpdmLibrary: "Debug"
        clearinghouseLibrary: "Debug"
        custodianLibrary: "Debug"
        sdfactoryLibrary: "Debug"
        offerProvider: "Debug"
      bpdm:
        clientId: &bpdmAdminClientId "sa-cl7-cx-5"
        clientSecret: &bpdmAdminClientSecret "changeme"
      custodian:
        clientId: "sa-cl5-custodian-2"
        clientSecret: "changeme"
      sdfactory:
        issuerBpn: "BPNL00000003CRHK"
        clientId: "sa-cl8-cx-1"
        clientSecret: "changeme"
      offerprovider:
        clientId: "sa-cl2-03"
        clientSecret: "changeme"
        encryptionConfigs:
          index0:
            encryptionKey:
              "95ee1429aa40c6bb6972520a9626b19c4306baf0efe3441c8cd41918ea198921"
      dim:
        clientId: "sa-cl2-05"
        clientSecret: "changeme"
        grantType: "client_credentials"
        scope: "openid"
        baseAddress: "https://ssi-dim-wallet-stub.prod.arena2036-x.de"
        universalResolverAddress: "https://dev.uniresolver.io/"
        encryptionConfigs:
          index0:
            encryptionKey:
              "6cbaf47ee30c778088e6faa44e2f0eed98beda86db06c7d2e37e32ab78e14b33"
      issuerComponent:
        clientId: "sa-cl2-04"
        clientSecret: "changeme"
        encryptionConfigs:
          index0:
            encryptionKey:
              "39ffab76f99ece1e4ac72f973d5c703737324a75c6445e84fa317a7833476a15"
      bpnDidResolver:
        # -- ApiKey for management endpoint of the bpnDidResolver. Secret-key 'bpndidresolver-api-key'.
        apiKey: ""
      onboardingServiceProvider:
        encryptionConfigs:
          index0:
            cipherMode: "CBC"
            paddingMode: "PKCS7"
            encryptionKey:
              "f7bc3d99f1ace73e7a75b794affbbc26206ab29909821a102aaccb2e95e45f7c"
          index1:
            encryptionKey:
              "8027152fe7a869c88acc86981760acd70ff1d660c2bd129eece94edef933caf7"
      invitation:
        encryptionConfigs:
          index0:
            encryptionKey:
              "d84fea29d6eac0fa51e36682b164e7d61693cd4202ed04306d2d9c5d46655e2c"
      mailing:
        encryptionConfigs:
          index0:
            encryptionKey:
              "d2e27d71b018cb36029184852f1baa3e26891be94718f77de4c7cc6c882fe317"
    mailing:
