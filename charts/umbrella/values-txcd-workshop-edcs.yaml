semantic-hub:
  enabled: false
  enableKeycloak: false
  keycloak:
    postgresql:
      architecture: standalone
      primary:
        persistence:
          enabled: true
  hub:
    authentication: true
    idpIssuerUri: "https://centralidp.txcd.arena2036-x.de/auth/realms/CX-Central"
    idpClientId: Cl3-CX-Semantic
    embeddedTripleStore: true
    livenessProbe:
      initialDelaySeconds: 200
    readinessProbe:
      initialDelaySeconds: 200
    host: semantics.txcd.arena2036-x.de
    ingress:
      enabled: true
      tls: true
      urlPrefix: "/hub"
      className: "traefik"
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-int
        external-dns.alpha.kubernetes.io/hostname: semantics.txcd.arena2036-x.de
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
  graphdb:
    enabled: true
    image: jena-fuseki-docker:5.0.0
    imagePullPolicy: Never
    storageClassName: ""
    storageSize: 8Gi

pgadmin4:
  enabled: false
  env:
    email: pgadmin4@txtest.org
    password: tractusxpgadmin4
  persistentVolume:
    enabled: true
  ingress:
    enabled: true
    ingressClassName: "traefik"
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-int
      external-dns.alpha.kubernetes.io/hostname: pgadmin4.txcd.arena2036-x.de
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
    hosts:
      - host: pgadmin4.txcd.arena2036-x.de
        paths:
          - path: /
            pathType: Prefix

