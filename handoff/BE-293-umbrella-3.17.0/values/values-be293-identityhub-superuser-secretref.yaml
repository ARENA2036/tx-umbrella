# OPTIONAL, RECOMMENDED FOR A FRESH TARGET. Pass it AFTER the secrets overlay (last -f wins).
#
# Source: public-tractus-x-umbrella charts/values-callback-activation.yaml and
# charts/umbrella/values-combined-portal-additions.yaml (working tree, edited 2026-10-28 after
# revision 21 was deployed). Revision 21 itself still passes these keys as inline values.
#
# Effect: the IdentityHub super-user key, the IssuerService super-user key and the Portal
# IdentityHub/IssuerAdmin API keys all come from ONE operator-managed Secret instead of values:
#   Secret identityhub-superuser, key identityhub-api-key
#   Format: base64("super-user") + "." + <random>, e.g. created out of band with
#     key="$(printf 'c3VwZXItdXNlcg==.%s' "$(openssl rand -base64 48 | tr -d '\n/+=' | cut -c1-52)")"
#     kubectl -n be293 create secret generic identityhub-superuser --from-literal=identityhub-api-key="$key"; unset key
# IdentityHub and IssuerService share the Vault alias super-user-apikey, so they MUST use the same key.
# The key only applies when the super-user is FIRST created (fresh install). The Secret is required:
# without it the pods stop with CreateContainerConfigError (fail closed).
#
# The null entries remove the inline placeholders from the secrets overlay; the Portal chart
# refuses to render when existingSecret is set together with apiKey/issuerAdminApiKey.
identity-and-trust-bundle:
  identity-hub-postgres:
    identityhub:
      env:
        EDC_IH_API_SUPERUSER_KEY: null
      envValueFrom:
        EDC_IH_API_SUPERUSER_KEY:
          secretKeyRef:
            name: identityhub-superuser
            key: identityhub-api-key
  issuer-service:
    issuerservice:
      env:
        EDC_IH_API_SUPERUSER_KEY: null
      envValueFrom:
        EDC_IH_API_SUPERUSER_KEY:
          secretKeyRef:
            name: identityhub-superuser
            key: identityhub-api-key
portal:
  backend:
    processesworker:
      identityHub:
        apiKey: null
        issuerAdminApiKey: null
        existingSecret: identityhub-superuser
