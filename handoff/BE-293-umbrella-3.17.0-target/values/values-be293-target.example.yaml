# BE-293 — SANITIZED EXAMPLE, NOT DEPLOYABLE. Umbrella 3.17.0 target values.
#
# Structure and section placement follow Federity-X PR #2:
# charts/umbrella/values-adopter-portal-onboarding-identityhub.yaml.
# This is a FULL target overlay (not the small Federity-X onboarding overlay).
# Additional deployment and persistence settings are kept after the PR #2 sections.
#
# Derived from ../BE-293-umbrella-3.17.0/values/values-be293-dev.example.yaml.
# Running tools/derive_target_example.rb again currently resets ordering.
#
# Namespace be293, ClusterIssuer letsencrypt-prod, default StorageClass.
# All other sample domains, operator markers and secrets placeholders must be
# replaced through tools/build_target_values.rb and the private secrets overlay.
# Do not deploy this example directly.

# In-cluster did:web resolver shim (same component as Federity-X PR #2).
didwebResolver:
  enabled: true

# ---- wallet: IdentityHub (shared, persistent target topology) ----
wallet:
  mode: identityHub
  identityHub:
    imagesOverridden: true
    shared:
      host: identity-hub.be293.target.example.invalid
      baseUrl: http://identity-hub.be293.target.example.invalid
      stsUrl: http://identity-hub.be293.target.example.invalid/api/sts
      tokenUrl: http://identity-hub.be293.target.example.invalid/oauth/token
      credentialServiceUrl: http://identity-hub.be293.target.example.invalid/api
      didBase: did:web:identity-hub.be293.target.example.invalid
      issuerServiceHost: issuer-service.be293.target.example.invalid
      issuerServiceBaseUrl: http://issuer-service.be293.target.example.invalid
      internalIdentityHubService: identity-hub-postgres
      ports:
        ihIdentity: 8082
        ihCredentials: 8083
        ihDid: 8084
        ihSts: 8087
      credentialServiceParticipantContextIdEncoding: plain
      vaultToken: ''

  operatorBpn: BPNL00000003CRHK
  participants:
    provider:
      vaultUrl: "<<SET-BY-OPERATOR:vault-address>>"
      vaultToken: ''
      vaultFolder: be293/dataprovider
    consumer1:
      vaultUrl: "<<SET-BY-OPERATOR:vault-address>>"
      vaultToken: ''
      vaultFolder: be293/dataconsumer-1
    consumer2:
      vaultUrl: "<<SET-BY-OPERATOR:vault-address>>"
      vaultToken: ''
      vaultFolder: be293/dataconsumer-2
  stub:
    host: ssi-dim-wallet-stub.be293.target.example.invalid
    baseUrl: http://ssi-dim-wallet-stub.be293.target.example.invalid
    stsUrl: http://ssi-dim-wallet-stub.be293.target.example.invalid/api/sts
    tokenUrl: http://ssi-dim-wallet-stub.be293.target.example.invalid/oauth/token
    credentialServiceUrl: http://ssi-dim-wallet-stub.be293.target.example.invalid/api
    didBase: did:web:ssi-dim-wallet-stub.be293.target.example.invalid

# ---- onboarding components (as in Federity-X PR #2) ----
bpdm:
  enabled: true
  postgres:
    primary:
      persistence:
        enabled: true
        storageClass: ''
        accessModes:
          - ReadWriteOnce
        size: 5Gi
  bpdm-gate:
    ingress:
      enabled: false
      hosts:
        - host: business-partners.be293.target.example.invalid
    applicationConfig:
      bpdm:
        security:
          auth-server-url: https://centralidp-be293.target.example.invalid/auth
        client:
          pool:
            base-url: http://be293-app-bpdm-pool
          orchestrator:
            base-url: http://be293-app-bpdm-orchestrator
    recoveryPreserveExistingSecret: true
  bpdm-pool:
    ingress:
      enabled: false
      hosts:
        - host: business-partners.be293.target.example.invalid
    applicationConfig:
      bpdm:
        security:
          auth-server-url: https://centralidp-be293.target.example.invalid/auth
        client:
          orchestrator:
            base-url: http://be293-app-bpdm-orchestrator
    recoveryPreserveExistingSecret: true
  bpdm-orchestrator:
    ingress:
      enabled: false
      hosts:
        - host: business-partners.be293.target.example.invalid
    applicationConfig:
      bpdm:
        security:
          auth-server-url: https://centralidp-be293.target.example.invalid/auth
    recoveryPreserveExistingSecret: true
  bpdm-cleaning-service-dummy:
    applicationConfig:
      bpdm:
        client:
          orchestrator:
            base-url: http://be293-app-bpdm-orchestrator
            provider:
              issuer-uri: https://centralidp-be293.target.example.invalid/auth/realms/CX-Central
    recoveryPreserveExistingSecret: true

bdrs-server-memory:
  enabled: false
  server:
    trustedIssuers:
      - did:web:issuer-service.be293.target.example.invalid:BPNL00000003CRHK
    env:
      EDC_IAM_DID_WEB_USE_HTTPS: false
    endpoints:
      management:
        authKey: "<<SET-FROM-SECRET-STORE:dev-overlay:bdrs-server-memory.server.endpoints.management.authKey>>"
    ingresses:
      - enabled: false
        hostname: bdrs-server.be293.target.example.invalid
        endpoints:
          - directory
          - management
        className: nginx
        tls:
          enabled: false

  seeding:
    enabled: true
    bpnList:
      - bpn: BPNL00000003CRHK
        did: did:web:identity-hub.be293.target.example.invalid:BPNL00000003CRHK
      - bpn: BPNL00000003AYRE
        did: did:web:identity-hub.be293.target.example.invalid:BPNL00000003AYRE
      - bpn: BPNL00000003AZQP
        did: did:web:identity-hub.be293.target.example.invalid:BPNL00000003AZQP
      - bpn: BPNL00000003AVTH
        did: did:web:identity-hub.be293.target.example.invalid:BPNL00000003AVTH
selfdescription:
  enabled: true
  sdfactory:
    secret:
      jwkSetUri: http://centralidp.be293.target.example.invalid/auth/realms/CX-Central/protocol/openid-connect/certs
      preserveExisting: true
      env:
        TX_PORTAL_CALLBACK_BASE_URL: http://portal-backend.be293.target.example.invalid
        TX_PORTAL_CALLBACK_TOKEN_URL: http://centralidp.be293.target.example.invalid/auth/realms/CX-Central/protocol/openid-connect/token
      iatp:
        sts:
          oauth:
            client:
              id: did:web:identity-hub.be293.target.example.invalid:BPNL00000003CRHK
      ingresses:
        - enabled: false
          hostname: identity-hub.be293.target.example.invalid
        - enabled: false
          hostname: identity-hub-admin.be293.target.example.invalid
  ingress:
    enabled: false
    hosts:
      - host: sdfactory.be293.target.example.invalid

smtp4dev:
  enabled: true
  ingress:
    url: smtp.be293.target.example.invalid
    enabled: false

bpndiscovery:
  enabled: true
  postgresql:
    image:
      registry: docker.io
      repository: bitnamilegacy/postgresql
      tag: 15-debian-11

    primary:
      persistence:
        enabled: true
        size: 5Gi
        storageClass: ''
        accessModes:
          - ReadWriteOnce
  bpndiscovery:
    host: semantics.be293.target.example.invalid
    ingress:
      enabled: false
    idp:
      issuerUri: https://centralidp-be293.target.example.invalid/auth/realms/CX-Central
    discoveryfinderClient:
      baseUrl: semantics.be293.target.example.invalid/discoveryfinder
      provider:
        tokenUri: https://centralidp-be293.target.example.invalid/auth/realms/CX-Central/protocol/openid-connect/token
discoveryfinder:
  enabled: true
  postgresql:
    image:
      registry: docker.io
      repository: bitnamilegacy/postgresql
      tag: 15-debian-11

    primary:
      persistence:
        enabled: true
        size: 5Gi
        storageClass: ''
        accessModes:
          - ReadWriteOnce
  discoveryfinder:
    host: semantics.be293.target.example.invalid
    properties:
      discoveryfinder:
        initialEndpoints:
          - endpointAddress: http://portal-backend.be293.target.example.invalid/api/administration/Connectors/discovery
            documentation: http://portal-backend.be293.target.example.invalid/api/administration/swagger/index.html
    idp:
      issuerUri: http://centralidp.be293.target.example.invalid/auth/realms/CX-Central
    ingress:
      enabled: false

# The standalone credential issuer is disabled in favor of IssuerService.
ssi-credential-issuer:
  enabled: false
  portalBackendAddress: http://portal-backend.be293.target.example.invalid
  walletAddress: http://ssi-dim-wallet-stub.be293.target.example.invalid
  walletTokenAddress: http://ssi-dim-wallet-stub.be293.target.example.invalid/oauth/token
  service:
    credential:
      issuerDid: did:web:ssi-dim-wallet-stub.be293.target.example.invalid:BPNL00000003CRHK
      statusListUrl: http://ssi-dim-wallet-stub.be293.target.example.invalid/status-list/BPNL00000003CRHK/8a6c7486-1e1f-4555-bdd2-1a178182651e
  centralidp:
    address: http://centralidp.be293.target.example.invalid
  ingress:
    enabled: false
    annotations:
      nginx.ingress.kubernetes.io/cors-allow-origin: http://*.be293.target.example.invalid
    hosts:
      - host: ssi-credential-issuer.be293.target.example.invalid

# ---- IdentityHub + IssuerService (PostgreSQL-backed target services) ----
identity-and-trust-bundle:
  enabled: true
  ssi-dim-wallet-stub:
    enabled: false
    wallet:
      host: ssi-dim-wallet-stub.be293.target.example.invalid
      ingress:
        enabled: false
      didHost: ssi-dim-wallet-stub.be293.target.example.invalid
      stubUrl: http://ssi-dim-wallet-stub.be293.target.example.invalid
      portal:
        host: http://portal-backend.be293.target.example.invalid
      keycloak:
        authServerUrl: http://centralidp.be293.target.example.invalid/auth
  identity-hub:
    enabled: false
    identityhub:
      image:
        pullPolicy: Always
      iatp:
        sts:
          oauth:
            client:
              id: did:web:identity-hub.be293.target.example.invalid:BPNL00000003CRHK
      ingresses:
        - enabled: false
          hostname: identity-hub.be293.target.example.invalid
        - enabled: false
          hostname: identity-hub-admin.be293.target.example.invalid
  issuer-service:
    enabled: true
    issuerservice:
      image:
        repository: registry.example.invalid/be293/be293-images
        tag: issuerservice-3633af-r1@sha256:8ee7427215933001710f2f7ce89d7508f192919154fb904cc832e4963f444d94
        pullPolicy: Always
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - "-c"
            - |
              echo "[wait-for-postgres] waiting for be293-app-issuer-postgresql:5432 ...";
              until nc -z be293-app-issuer-postgresql 5432; do
                echo "[wait-for-postgres] not ready, retry in 2s"; sleep 2;
              done;
              echo "[wait-for-postgres] postgres is reachable";
      ingresses:
        - enabled: false
        - enabled: false
      env:
        EDC_IH_API_SUPERUSER_KEY: "<<SET-FROM-SECRET-STORE:dev-overlay:identity-and-trust-bundle.issuer-service.issuerservice.env.EDC_IH_API_SUPERUSER_KEY>>"
      envValueFrom:
        EDC_DATASOURCE_ATTESTATIONDEFINITIONS_PASSWORD:
          secretKeyRef:
            key: postgres-password
            name: be293-issuerservice-postgres
        EDC_DATASOURCE_CREDENTIALDEFINITIONS_PASSWORD:
          secretKeyRef:
            key: postgres-password
            name: be293-issuerservice-postgres
        EDC_DATASOURCE_CREDENTIALS_PASSWORD:
          secretKeyRef:
            key: postgres-password
            name: be293-issuerservice-postgres
        EDC_DATASOURCE_CUSTOMATTESTATIONS_PASSWORD:
          secretKeyRef:
            key: postgres-password
            name: be293-issuerservice-postgres
        EDC_DATASOURCE_DIDRESOURCE_PASSWORD:
          secretKeyRef:
            key: postgres-password
            name: be293-issuerservice-postgres
        EDC_DATASOURCE_HOLDER_PASSWORD:
          secretKeyRef:
            key: postgres-password
            name: be293-issuerservice-postgres
        EDC_DATASOURCE_ISSUANCEPROCESS_PASSWORD:
          secretKeyRef:
            key: postgres-password
            name: be293-issuerservice-postgres
        EDC_DATASOURCE_JTI_PASSWORD:
          secretKeyRef:
            key: postgres-password
            name: be293-issuerservice-postgres
        EDC_DATASOURCE_KEYPAIR_PASSWORD:
          secretKeyRef:
            key: postgres-password
            name: be293-issuerservice-postgres
        EDC_DATASOURCE_PARTICIPANT_PASSWORD:
          secretKeyRef:
            key: postgres-password
            name: be293-issuerservice-postgres
        EDC_DATASOURCE_PARTICIPANTCONTEXT_PASSWORD:
          secretKeyRef:
            key: postgres-password
            name: be293-issuerservice-postgres
        EDC_DATASOURCE_PARTICIPANTCONTEXTCONFIG_PASSWORD:
          secretKeyRef:
            key: postgres-password
            name: be293-issuerservice-postgres
        EDC_DATASOURCE_STSCLIENT_PASSWORD:
          secretKeyRef:
            key: postgres-password
            name: be293-issuerservice-postgres
      runtimeSecret:
        enabled: true
        name: be293-issuerservice-runtime
    install:
      vault: false
    postgresql:
      primary:
        persistence:
          enabled: true
          storageClass: ''
      auth:
        existingSecret: be293-issuerservice-postgres
        secretKeys:
          passwordKey: postgres-password
    vault:
      server:
        authDelegator:
          enabled: false
      hashicorp:
        url: "<<SET-BY-OPERATOR:vault-address>>"
        paths:
          secret: "/v1/secret"
    imagePullSecrets:
      - name: "<<SET-BY-OPERATOR:pull-secret-name>>"
    statuslist:
      signing_key:
        alias: issuer-bpnl00000003crhk-key-1
      callback:
        address: https://issuer-service.be293.target.example.invalid/statuslist
    pgadmin4:
      enabled: false

  identity-hub-postgres:
    enabled: true
    install:
      postgresql: true
      vault: false
    imagePullSecrets:
      - name: "<<SET-BY-OPERATOR:pull-secret-name>>"
    identityhub:
      image:
        repository: registry.example.invalid/be293/be293-images
        tag: identityhub-3633af-r1@sha256:5c0548957e0d7af94259345d4f9ab0a4f85851b974b822cb7d9cc1f62a999805
        pullPolicy: Always
      replicaCount: 1
      env:
        EDC_IH_API_SUPERUSER_KEY: "<<SET-FROM-SECRET-STORE:dev-overlay:identity-and-trust-bundle.identity-hub-postgres.identityhub.env.EDC_IH_API_SUPERUSER_KEY>>"
        TX_PORTAL_CALLBACK_BASE_URL: http://be293-app-portal-administration-service:8080
        TX_PORTAL_CALLBACK_TOKEN_URL: https://centralidp-be293.target.example.invalid/auth/realms/CX-Central/protocol/openid-connect/token
        TX_PORTAL_CALLBACK_CLIENT_ID: sa-cl24-01
      livenessProbe:
        initialDelaySeconds: 90
        periodSeconds: 15
        timeoutSeconds: 10
        failureThreshold: 6
      readinessProbe:
        initialDelaySeconds: 90
        periodSeconds: 15
        timeoutSeconds: 10
        failureThreshold: 6
      endpoints:
        identity:
          authKeyAlias: super-user-apikey
        accounts:
          authKeyAlias: sup3r$3cr3t
      envValueFrom:
        EDC_DATASOURCE_CREDENTIALREQUEST_PASSWORD:
          secretKeyRef:
            key: postgres-password
            name: be293-identityhub-postgres
        EDC_DATASOURCE_CREDENTIALS_PASSWORD:
          secretKeyRef:
            key: postgres-password
            name: be293-identityhub-postgres
        EDC_DATASOURCE_DIDRESOURCE_PASSWORD:
          secretKeyRef:
            key: postgres-password
            name: be293-identityhub-postgres
        EDC_DATASOURCE_JTI_PASSWORD:
          secretKeyRef:
            key: postgres-password
            name: be293-identityhub-postgres
        EDC_DATASOURCE_KEYPAIR_PASSWORD:
          secretKeyRef:
            key: postgres-password
            name: be293-identityhub-postgres
        EDC_DATASOURCE_PARTICIPANTCONTEXT_PASSWORD:
          secretKeyRef:
            key: postgres-password
            name: be293-identityhub-postgres
        EDC_DATASOURCE_PARTICIPANTCONTEXTCONFIG_PASSWORD:
          secretKeyRef:
            key: postgres-password
            name: be293-identityhub-postgres
        EDC_DATASOURCE_STSCLIENT_PASSWORD:
          secretKeyRef:
            key: postgres-password
            name: be293-identityhub-postgres
      runtimeSecret:
        enabled: true
        name: be293-identityhub-runtime
      ingresses:
        - enabled: false
          hostname: identity-hub.be293.target.example.invalid
          endpoints:
            - credentials
            - did
            - sts
          className: nginx
          tls:
            enabled: false
        - enabled: false
          hostname: identity-hub-admin.be293.target.example.invalid
          endpoints:
            - identity
            - accounts
          className: nginx
          tls:
            enabled: false
      resources:
        limits:
          cpu: 1
          memory: 2Gi
        requests:
          cpu: 250m
          memory: 512Mi
      iatp:
        sts:
          oauth:
            client:
              enabled: false
              id: did:web:identity-hub.be293.target.example.invalid:BPNL00000003CRHK
              secret: "<<SET-FROM-SECRET-STORE:dev-overlay:identity-and-trust-bundle.identity-hub-postgres.identityhub.iatp.sts.oauth.client.secret>>"
              secret_alias: "<<SET-FROM-SECRET-STORE:dev-overlay:identity-and-trust-bundle.identity-hub-postgres.identityhub.iatp.sts.oauth.client.secret_alias>>"
              x_api_key: "<<SET-FROM-SECRET-STORE:dev-overlay:identity-and-trust-bundle.identity-hub-postgres.identityhub.iatp.sts.oauth.client.x_api_key>>"
      didweb:
        https: false
    postgresql:
      jdbcUrl: jdbc:postgresql://{{ .Release.Name }}-identityhub-postgresql:5432/ih
      primary:
        persistence:
          enabled: true
          storageClass: ''
      auth:
        existingSecret: be293-identityhub-postgres
        secretKeys:
          passwordKey: postgres-password
      nameOverride: identityhub-postgresql
    vault:
      hashicorp:
        url: "<<SET-BY-OPERATOR:vault-address>>"

