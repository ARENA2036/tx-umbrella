# ---- Persistent BDRS implementation (replaces memory BDRS) ----
bdrs-server:
  enabled: true
  install:
    postgresql: true
    vault: false
  fullnameOverride: bdrs-server
  nameOverride: bdrs-server
  server:
    image:
      repository: tractusx/bdrs-server
      tag: 0.6.0
      digest: sha256:e73c566f3b20f9e0f3db21d6e49911d01fe22fd4c01f463e2a52e26914cfd206
    initContainers:
      - command:
          - "/bin/sh"
          - "/provision/provision.sh"
        env:
          - name: VAULT_URL
            value: "<<SET-BY-OPERATOR:vault-address>>"
        image: alpine/k8s:1.31.3
        name: provision-vault-aliases
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
        volumeMounts:
          - mountPath: "/provision"
            name: bdrs-provision
            readOnly: true
          - mountPath: "/secrets/vault"
            name: bdrs-vault-token
            readOnly: true
          - mountPath: "/secrets/database"
            name: bdrs-database
            readOnly: true
          - mountPath: "/secrets/management"
            name: bdrs-management
            readOnly: true
          - mountPath: "/work"
            name: bdrs-provision-work
    endpoints:
      management:
        authKeyAlias: bdrs-management-api-key
        authType: tokenbased
    trustedIssuers:
      - did:web:issuer-service.be293.target.example.invalid:BPNL00000003CRHK
    podSecurityContext:
      fsGroup: 1000
    env:
      EDC_IAM_DID_WEB_USE_HTTPS: false
    envValueFrom:
      EDC_VAULT_HASHICORP_TOKEN:
        secretKeyRef:
          key: token
          name: be293-bdrs-vault-token
    ingresses:
      - enabled: false
        hostname: bdrs-server.be293.target.example.invalid
        endpoints:
          - directory
          - management
        className: nginx
        tls:
          enabled: false
    volumes:
      - configMap:
          name: umbrella-bdrs-provision
        name: bdrs-provision
      - name: bdrs-vault-token
        secret:
          secretName: be293-bdrs-vault-token
      - name: bdrs-database
        secret:
          secretName: be293-bdrs-database
      - name: bdrs-management
        secret:
          secretName: be293-bdrs-management
      - emptyDir:
          medium: Memory
          sizeLimit: 1Mi
        name: bdrs-provision-work
    nodeSelector:
      kubernetes.io/arch: amd64
  postgresql:
    jdbcUrl: jdbc:postgresql://bdrs-postgresql:5432/bdrs
    persistence:
      enabled: true
      size: 5Gi
      storageClass: ''
      accessModes:
        - ReadWriteOnce
    auth:
      database: bdrs
      password:
      existingSecret: be293-bdrs-postgres-admin
    fullnameOverride: bdrs-postgresql
    customUser:
      name: bdrs
      database: bdrs
      existingSecret: be293-bdrs-database
      secretKeys:
        name: username
        database: ''
        password: password
    service:
      selectorLabels:
        statefulset.kubernetes.io/pod-name: bdrs-postgresql-0
  vault:
    injector:
      enabled: false
    server:
      dev:
        enabled: false
      image:
        tag: 1.15.2
      authDelegator:
        enabled: false
      extraLabels:
        be293.vault-owner: bdrs
      dataStorage:
        enabled: true
        size: 1Gi
        mountPath: "/vault/data"
      auditStorage:
        enabled: false
      standalone:
        enabled: true
        config: |
          ui = false
          disable_mlock = true
          listener "tcp" {
            address = "[::]:8200"
            cluster_address = "[::]:8201"
            tls_disable = 1
          }
          storage "raft" {
            path = "/vault/data"
            node_id = "bdrs-vault-0"
          }
      ha:
        enabled: false
    hashicorp:
      url: "<<SET-BY-OPERATOR:vault-address>>"
      token:
      paths:
        secret: "/v1/secret"
        health: "/v1/sys/health"
    fullnameOverride: bdrs-vault
  be293Provisioning:
    enabled: true
  seeding:
    bpnList:
      - bpn: BPNL00000003CRHK
        did: did:web:identity-hub.be293.target.example.invalid:BPNL00000003CRHK
      - bpn: BPNL00000003AYRE
        did: did:web:identity-hub.be293.target.example.invalid:BPNL00000003AYRE
      - bpn: BPNL00000003AZQP
        did: did:web:identity-hub.be293.target.example.invalid:BPNL00000003AZQP
      - bpn: BPNL00000003AVTH
        did: did:web:identity-hub.be293.target.example.invalid:BPNL00000003AVTH
    enabled: true
    existingSecret: be293-bdrs-management
    existingSecretKey: api-key
    url: http://bdrs-server:8081

