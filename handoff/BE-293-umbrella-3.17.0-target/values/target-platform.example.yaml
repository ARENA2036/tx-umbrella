###############################################################
#
# BE-293 TARGET PLATFORM INPUTS (be293-target profile). TEMPLATE ONLY.
#
# This is NOT a Helm values overlay. It is the flat input file read by
# tools/build_target_values.rb, which renders the private be293-target overlays.
# Every value below must come from the target-cluster operator.
#
# Already confirmed and fixed in the chart contract (not set here): namespace
# be293, ClusterIssuer letsencrypt-prod, cluster-default StorageClass.
#
# No credentials belong in this file.
#
# Usage:
#   cp values/target-platform.example.yaml <name>.private.yaml   # git-ignored
#   # fill every <<SET-BY-OPERATOR:...>> value, then:
#   ruby tools/build_target_values.rb <name>.private.yaml <out-dir>
###############################################################

# ---- DNS and ingress ----
# e.g. hosts become identity-hub.<dnsZone>
dnsZone: "<<SET-BY-OPERATOR:dns-zone>>"
# kubectl get ingressclass
ingressClass: "<<SET-BY-OPERATOR:ingress-class>>"
# does ExternalDNS create the DNS records?
externalDns: "<<SET-BY-OPERATOR:true-or-false>>"

# ---- Images ----
# registry holding the 14 mirrored BE-293 images
registryHost: "<<SET-BY-OPERATOR:registry-host>>"
imageRepository: "<<SET-BY-OPERATOR:registry-host/path>>"
# pre-provisioned in namespace be293
pullSecretName: "<<SET-BY-OPERATOR:pull-secret-name>>"

# ---- Vault ----
# in-namespace release: http://be293-vault:8200
vaultAddress: "<<SET-BY-OPERATOR:vault-address>>"

# ---- Release approval ----
# approval of the Helm hooks (see BLOCKERS B-04, B-11)
helmHooksApproved: "<<SET-BY-OPERATOR:true-or-false>>"
