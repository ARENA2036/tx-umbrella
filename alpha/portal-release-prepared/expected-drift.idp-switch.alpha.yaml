# Reviewed drift for the be293-portal IdP switch (tools/switch-idp-be293.sh): the Portal moves from the shared
# centralidp/sharedidp to centralidp-be293/sharedidp-be293, BPDM keeps the SHARED CentralIDP token endpoint
# (backend.processesworker.bpdm.tokenAddress, patched chart), and new shared-IdP realms send mail to the smtp4dev
# sink (D5). Generated from an offline diff of the patched chart (four values files, post-renderer) before and
# after the change, 2026-11-17. Only environment variables change; images, Secrets, Services, ConfigMaps,
# StatefulSets and Ingresses do not.
#
# Format as expected-drift.alpha.yaml: "Kind/name" => items, each exact or a prefix ending in "*". Each item ends
# in "*" only so the ownership note ([owner: helm]) matches; an SSA CONFLICT is a FAIL and is never excused here.
# Review every change to this file; never add an item only to make a run pass.

CronJob/be293-portal-processes-worker:
  - "container be293-portal-processes-worker env APPLICATIONCHECKLIST__CUSTODIAN__TOKENADDRESS: value differs (live=https://centralidp.test.tractus-x.com/auth/realms/CX-Central/protocol/openid-connect/token rendered=https://centralidp-be293.test.tractus-x.com/auth/realms/CX-Central/protocol/openid-connect/token)*"
  - "container be293-portal-processes-worker env APPLICATIONCHECKLIST__ISSUERCOMPONENT__TOKENADDRESS: value differs (live=https://centralidp.test.tractus-x.com/auth/realms/CX-Central/protocol/openid-connect/token rendered=https://centralidp-be293.test.tractus-x.com/auth/realms/CX-Central/protocol/openid-connect/token)*"
  - "container be293-portal-processes-worker env APPLICATIONCHECKLIST__SDFACTORY__TOKENADDRESS: value differs (live=https://centralidp.test.tractus-x.com/auth/realms/CX-Central/protocol/openid-connect/token rendered=https://centralidp-be293.test.tractus-x.com/auth/realms/CX-Central/protocol/openid-connect/token)*"
  - "container be293-portal-processes-worker env KEYCLOAK__CENTRAL__CONNECTIONSTRING: value differs (live=https://centralidp.test.tractus-x.com rendered=https://centralidp-be293.test.tractus-x.com)*"
  - "container be293-portal-processes-worker env KEYCLOAK__SHARED__CONNECTIONSTRING: value differs (live=https://sharedidp.test.tractus-x.com rendered=https://sharedidp-be293.test.tractus-x.com)*"
  - "container be293-portal-processes-worker env OFFERPROVIDER__TOKENADDRESS: value differs (live=https://centralidp.test.tractus-x.com/auth/realms/CX-Central/protocol/openid-connect/token rendered=https://centralidp-be293.test.tractus-x.com/auth/realms/CX-Central/protocol/openid-connect/token)*"
  - "container be293-portal-processes-worker env PROVISIONING__SHAREDREALM__SMTPSERVER__AUTH: value differs (live=true rendered=false)*"
  - "container be293-portal-processes-worker env PROVISIONING__SHAREDREALM__SMTPSERVER__FROM: value differs*"
  - "container be293-portal-processes-worker env PROVISIONING__SHAREDREALM__SMTPSERVER__HOST: value differs (live=smtp.office365.com rendered=be293-smtp4dev.be293.svc.cluster.local)*"
