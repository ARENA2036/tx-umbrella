# Secret contract for the BE-293 Portal release in be293. NAMES AND KEYS ONLY - never put values here.
#
# Classes:
#   owner-provisioned  credential issued by the owner of a shared service in release26-09 (dedicated to be293,
#                      least privilege, never the old Portal's credential). Created in be293 before install.
#   operator-generated Portal-owned key material generated fresh for be293 (e.g. `openssl rand -hex 32`).
#   chart-generated    created by the chart on first install with random values, preserved by Helm lookup.
#   unused             integration disabled on Alpha (endpoint *.disabled.invalid). Pre-created with the printable
#                      sentinel `disabled-<feature>-no-access` (not a credential), never omitted: for a key missing
#                      from an existing Secret the chart writes randAlphaNum UNENCODED into data:, which decodes
#                      to random bytes; a NUL byte among them breaks container creation (Alpha, 2026-11-05).
#
# Secrets that the chart ALSO renders (keycloak, interfaces, mailing) must be pre-created with Helm adoption
# metadata, otherwise `helm install` refuses them, and lookup then preserves the provided data:
#   metadata.labels."app.kubernetes.io/managed-by": Helm
#   metadata.annotations."meta.helm.sh/release-name": be293-portal
#   metadata.annotations."meta.helm.sh/release-namespace": be293
namespace: be293
release: be293-portal
secrets:
#
# Reuse: clientIds below are the standard seeded Tractus-X service accounts already used by the existing
# Portal stack (centralidp chart seed + charts/umbrella/values.yaml). Reusing them needs NO new Keycloak
# object, but their secrets belong to the Keycloak owner: either (a) the owner authorizes reuse and supplies
# the existing secret out-of-band, or (b) issues dedicated be293 clients with the same roles. Option (a)
# shares a credential with the old Portal (rotation affects both).
  - name: be293-portal-keycloak
    adoptedByChart: true
    keys:
      central-client-secret: {class: owner-provisioned, owner: Keycloak (centralidp), clientId: sa-cl1-reg-2, realm: CX-Central, reuse: "existing seeded SA; owner authorizes reuse or issues dedicated client (W2)"}
      shared-client-secret: {class: owner-provisioned, owner: Keycloak (sharedidp), clientId: sa-cl1-reg-1, realm: master, reuse: "existing seeded SA; owner authorizes reuse or issues dedicated client (W2)"}
  - name: be293-portal-interfaces
    adoptedByChart: true
    keys:
      bpdm-client-secret: {class: owner-provisioned, owner: Keycloak/BPDM, clientId: sa-cl7-cx-5, realm: CX-Central, reuse: "existing seeded SA (W7)"}
      sdfactory-client-secret: {class: owner-provisioned, owner: Keycloak/SD-Factory, clientId: sa-cl8-cx-1, realm: CX-Central, reuse: "existing seeded SA (W8)"}
      dim-encryption-key0: {class: operator-generated, format: "64 hex chars"}
      invitation-encryption-key0: {class: operator-generated, format: "64 hex chars"}
      mailing-encryption-key0: {class: operator-generated, format: "64 hex chars"}
      offerprovider-encryption-key0: {class: operator-generated, format: "64 hex chars"}
      onboardingserviceprovider-encryption-key0: {class: operator-generated, format: "64 hex chars"}
      onboardingserviceprovider-encryption-key1: {class: operator-generated, format: "64 hex chars"}
      serviceaccount-encryption-key0: {class: operator-generated, format: "64 hex chars"}
      clearinghouse-client-secret-default: {class: unused}
      custodian-client-secret: {class: unused}
      dim-client-secret: {class: unused}
      issuercomponent-client-secret: {class: unused}
      offerprovider-client-secret: {class: unused}
  - name: be293-portal-mailing
    adoptedByChart: true
    keys:
      password: {class: owner-provisioned, owner: SMTP provider}
      provisioning-sharedrealm-password: {class: owner-provisioned, owner: SMTP provider}
  - name: be293-portal-identityhub
    adoptedByChart: false
    keys:
      # A1 requires ROLE_ADMIN or ROLE_PROVISIONER (EDC IdentityHub 0.17.0 ParticipantContextApiController).
      # Reuse option: the existing super-user key of the selected identity-hub-0x release (full admin).
      identityhub-api-key: {class: owner-provisioned, owner: IdentityHub, reuse: "existing super-user key, or a dedicated provisioner-role key (W4)"}
      # A5 requires ROLE_ADMIN/PARTICIPANT/PROVISIONER on the issuer participant context.
      issuerservice-admin-api-key: {class: owner-provisioned, owner: IssuerService, reuse: "existing super-user/issuer key, or a dedicated key (W5)"}
  - name: be293-portal-bdrs
    adoptedByChart: false
    keys:
      management-api-key: {class: owner-provisioned, owner: BDRS, reuse: "existing bdrs-server management API key (single key; no scoped alternative in BDRS 0.6.0) (W6)"}
  - name: be293-portal-postgres
    adoptedByChart: true
    keys:
      postgres-password: {class: chart-generated}
      replication-password: {class: chart-generated}
      portal-password: {class: chart-generated}
      provisioning-password: {class: chart-generated}
  - name: be293-portal-registry-pull
    adoptedByChart: false
    type: kubernetes.io/dockerconfigjson
    keys:
      .dockerconfigjson: {class: owner-provisioned, owner: Platform (approved registry), purpose: "read-only pull of the rebuilt Portal images"}
