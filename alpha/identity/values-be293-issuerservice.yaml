# BE-293 Alpha: own IssuerService in be293. Official chart tractusx-issuerservice v0.4.1 (eclipse-tractusx/tractusx-identityhub
# @ 64d415b7, every file blob-identical, see charts.lock.yaml) with the official image tractusx/issuerservice:0.4.1
# (EDC 0.17.0). Release: be293-issuerservice, namespace be293.
#
# Secrets: the chart renders the Vault token and every datasource password into ConfigMaps (envFrom). Here those keys carry
# only the placeholder "from-secret-ref", and `issuerservice.envValueFrom` sets the SAME (dotted) names from Secrets.
# Kubernetes gives an `env` entry precedence over an `envFrom` key of the same name, so the running value always comes
# from the Secret and no credential is in values, ConfigMaps or the Helm release (gate I3).
#
# Public on issuer-be293.test.tractus-x.com: DID documents (/), DCP issuance (/api/issuance), status lists (/statuslist).
# The admin (8086), identity (8087) and STS (8085) APIs stay ClusterIP-only.
fullnameOverride: be293-issuerservice

install:
  postgresql: false
  vault: false
pgadmin4:
  enabled: false

issuerservice:
  image:
    repository: "tractusx/issuerservice"
    tag: "0.4.1@sha256:4fc515d6f7b31a04dabe31120cd0b7a8ae39f6b942eb17049dd5c99ca57f7d3e"
    pullPolicy: IfNotPresent
  didweb:
    https: true
  envValueFrom:
    edc.vault.hashicorp.token: {secretKeyRef: {name: be293-issuerservice-vault-token, key: token}}
    edc.ih.api.superuser.key: {secretKeyRef: {name: be293-issuerservice-superuser, key: api-key}}
    edc.datasource.attestationdefinitions.password: &dbpw {secretKeyRef: {name: be293-identity-db-users, key: ISSUERSERVICE_DB_PASSWORD}}
    edc.datasource.credentialdefinitions.password: *dbpw
    edc.datasource.credentials.password: *dbpw
    edc.datasource.customattestations.password: *dbpw
    edc.datasource.didresource.password: *dbpw
    edc.datasource.holder.password: *dbpw
    edc.datasource.issuanceprocess.password: *dbpw
    edc.datasource.jti.password: *dbpw
    edc.datasource.keypair.password: *dbpw
    edc.datasource.participant.password: *dbpw
    edc.datasource.participantcontext.password: *dbpw
    edc.datasource.participantcontextconfig.password: *dbpw
    edc.datasource.stsclient.password: *dbpw
  ingresses:
    - enabled: true
      hostname: "issuer-be293.test.tractus-x.com"
      annotations:
        external-dns.alpha.kubernetes.io/hostname: "issuer-be293.test.tractus-x.com"
      endpoints:
        - did
        - issuance
        - statuslist
      className: "nginx"
      tls:
        enabled: true
        secretName: "be293-issuerservice-tls"
      certManager:
        clusterIssuer: "letsencrypt-prod"
  logging:
    # Console only: the super-user line SuperUserSeedExtension writes at INFO on first boot must not be persisted to a
    # file. The key it shows is rotated by the seed job right after first boot (identity-seed-be293.alpha.yaml).
    handlers:
      - java.util.logging.ConsoleHandler
    persistence:
      enabled: false
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1.5"
      memory: 1Gi

statuslist:
  callback:
    address: "https://issuer-be293.test.tractus-x.com/statuslist"

postgresql:
  jdbcUrl: "jdbc:postgresql://be293-identity-postgresql.be293.svc.cluster.local:5432/issuerservice"
  auth:
    database: "issuerservice"
    username: "issuerservice"
    password: "from-secret-ref"

vault:
  hashicorp:
    url: "http://be293-identity-vault.be293.svc.cluster.local:8200"
    token: "from-secret-ref"
    paths:
      secret: /v1/issuerservice          # KV v2 mount owned by this release only (policy be293-issuerservice)
      health: /v1/sys/health
