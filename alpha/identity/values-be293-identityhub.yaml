# BE-293 Alpha: own IdentityHub in be293. Official chart tractusx-identityhub v0.4.1 (eclipse-tractusx/tractusx-identityhub
# @ 64d415b7, every file blob-identical, see charts.lock.yaml) with the official image tractusx/identityhub:0.4.1
# (EDC 0.17.0). Release: be293-identityhub, namespace be293.
#
# Secrets: same pattern as values-be293-issuerservice.yaml (ConfigMap placeholder "from-secret-ref", real value through an
# `env` entry of the same name from a Secret; gate I3).
#
# Public on identityhub-be293.test.tractus-x.com: holder DID documents (/) and the DCP credential service
# (/api/credentials, where the issuer delivers credentials). The identity API (8082) and STS (8087) stay ClusterIP-only.
# The Portal's credential-await polling (IdentityHubCredentialAwaitBusinessLogic) advances on ISSUED, so the official image
# without the BE-293 callback extension is sufficient.
fullnameOverride: be293-identityhub

install:
  postgresql: false
  vault: false

identityhub:
  image:
    repository: "tractusx/identityhub"
    tag: "0.4.1@sha256:48b47c05c6292ab0d81d59203c408044edd0d1b9c383e96ab2b67ef6b85fc8a0"
    pullPolicy: IfNotPresent
  endpoints:
    identity:
      port: 8082
      path: /api/identity
      authKeyAlias: "be293-identity-api-auth"     # a Vault alias name, not a secret
  didweb:
    https: true
  iatp:
    sts:
      oauth:
        client:
          enabled: false                         # no pre-configured participant; holders are created by the Portal
          id: "unused"
          secret: "unused"
          secret_alias: "unused"
          x_api_key: "unused"
  envValueFrom:
    edc.vault.hashicorp.token: {secretKeyRef: {name: be293-identityhub-vault-token, key: token}}
    edc.ih.api.superuser.key: {secretKeyRef: {name: be293-identityhub-superuser, key: api-key}}
    edc.datasource.credentialrequest.password: &dbpw {secretKeyRef: {name: be293-identity-db-users, key: IDENTITYHUB_DB_PASSWORD}}
    edc.datasource.credentials.password: *dbpw
    edc.datasource.didresource.password: *dbpw
    edc.datasource.jti.password: *dbpw
    edc.datasource.keypair.password: *dbpw
    edc.datasource.participantcontext.password: *dbpw
    edc.datasource.participantcontextconfig.password: *dbpw
    edc.datasource.stsclient.password: *dbpw
  ingresses:
    - enabled: true
      hostname: "identityhub-be293.test.tractus-x.com"
      annotations:
        external-dns.alpha.kubernetes.io/hostname: "identityhub-be293.test.tractus-x.com"
      endpoints:
        - credentials
        - did
      className: "nginx"
      tls:
        enabled: true
        secretName: "be293-identityhub-tls"
      certManager:
        clusterIssuer: "letsencrypt-prod"
    - enabled: false
      hostname: "identityhub.identity.local"
      endpoints:
        - identity
      tls:
        enabled: false
  logging:
    handlers:
      - java.util.logging.ConsoleHandler
    persistence:
      enabled: false
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1.5"
      memory: 1Gi

postgresql:
  jdbcUrl: "jdbc:postgresql://be293-identity-postgresql.be293.svc.cluster.local:5432/identityhub"
  auth:
    database: "identityhub"
    username: "identityhub"
    password: "from-secret-ref"

vault:
  hashicorp:
    url: "http://be293-identity-vault.be293.svc.cluster.local:8200"
    token: "from-secret-ref"
    paths:
      secret: /v1/identityhub            # KV v2 mount owned by this release only (policy be293-identityhub)
      health: /v1/sys/health
