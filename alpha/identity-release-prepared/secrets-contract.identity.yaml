# Secrets of the own identity stack in be293. KEY NAMES ONLY: no value of any of these belongs in Git, values files,
# Helm releases, command lines or logs. "Who creates" is the only writer; everything else reads by secretKeyRef.
#
#   generated   tools/identity-secrets-be293.sh --execute (random, generated on the operator's machine straight into the
#               Secret through a temporary file in a 0700 directory; never echoed)
#   vault       tools/identity-vault-be293.sh --configure (periodic, policy-scoped Vault token; never the root token)
#   seed        identity-seed-be293.alpha.yaml Job (rotated or issued API keys, written through the Kubernetes API)
secrets:
  - name: be293-identity-postgresql
    keys:
      postgres-password: {class: generated, usedBy: [be293-identity-postgresql]}
  - name: be293-identity-db-users
    keys:
      ISSUERSERVICE_DB_PASSWORD: {class: generated, usedBy: [be293-identity-postgresql init, be293-issuerservice]}
      IDENTITYHUB_DB_PASSWORD: {class: generated, usedBy: [be293-identity-postgresql init, be293-identityhub]}
      BDRS_DB_PASSWORD: {class: generated, usedBy: [be293-identity-postgresql init, Vault alias edc.datasource.didentry.password]}
  - name: be293-issuerservice-superuser
    keys:
      # Format base64("super-user").<random> (SuperUserSeedExtension). The bootstrap value is logged once at INFO on first
      # boot; the seed job rotates it (POST /api/identity/v1alpha/participants/super-user/token) and overwrites this key.
      api-key: {class: "generated, then seed", usedBy: [be293-issuerservice (first boot only), seed job]}
  - name: be293-identityhub-superuser
    keys:
      api-key: {class: "generated, then seed", usedBy: [be293-identityhub (first boot only), seed job]}
  - name: be293-bdrs-management
    keys:
      api-key: {class: generated, usedBy: [Vault alias mgmt-api-key (bdrs mount)]}
  - name: be293-issuerservice-vault-token
    keys:
      token: {class: vault, policy: be293-issuerservice, usedBy: [be293-issuerservice]}
  - name: be293-identityhub-vault-token
    keys:
      token: {class: vault, policy: be293-identityhub, usedBy: [be293-identityhub]}
  - name: be293-bdrs-vault-token
    keys:
      token: {class: vault, policy: be293-bdrs, usedBy: [be293-bdrs]}
  # Portal-facing scoped keys. NEW Secrets, so the live Portal Secrets (be293-portal-identityhub, be293-portal-bdrs) stay
  # untouched until the switch. Created empty by identity-secrets-be293.sh, filled by the seed job / the secrets tool.
  - name: be293-portal-identityhub-be293
    keys:
      identityhub-api-key: {class: seed, scope: "IdentityHub participant portal-provisioner, role admin (needed to read holder credentials)"}
      issuerservice-admin-api-key: {class: seed, scope: "IssuerService participant context issuer (owner-scoped, not admin)"}
  - name: be293-portal-bdrs-be293
    keys:
      management-api-key: {class: generated, note: "same value as be293-bdrs-management/api-key (single BDRS management key)"}
  # E2E test connectors (be293-edc-fv1 provider, be293-edc-guc consumer). "generated" = identity-secrets-be293.sh --edc;
  # "vault" = identity-vault-be293.sh --configure-edc. Vault aliases on the connectors' own mounts are listed for
  # completeness; they live only in Vault, never in a Kubernetes Secret.
  - name: be293-edc-postgresql
    keys:
      postgres-password: {class: generated, usedBy: [be293-edc-postgresql]}
  - name: be293-edc-db-users
    keys:
      EDC_FV1_DB_PASSWORD: {class: generated, usedBy: [be293-edc-postgresql init, be293-edc-fv1]}
      EDC_GUC_DB_PASSWORD: {class: generated, usedBy: [be293-edc-postgresql init, be293-edc-guc]}
  - name: be293-edc-fv1-auth
    keys:
      management-api-key: {class: generated, usedBy: [be293-edc-fv1 control plane (X-Api-Key, port-forward only)]}
      proxy-api-key: {class: generated, usedBy: [be293-edc-fv1 data plane consumer proxy (port-forward only)]}
  - name: be293-edc-guc-auth
    keys:
      management-api-key: {class: generated, usedBy: [be293-edc-guc control plane (X-Api-Key, port-forward only)]}
      proxy-api-key: {class: generated, usedBy: [be293-edc-guc data plane consumer proxy (port-forward only)]}
  - name: be293-edc-fv1-vault-token
    keys:
      token: {class: vault, policy: be293-edc-fv1, usedBy: [be293-edc-fv1]}
  - name: be293-edc-guc-vault-token
    keys:
      token: {class: vault, policy: be293-edc-guc, usedBy: [be293-edc-guc]}
vaultAliases:
  # KV v2 mounts edc-fv1 and edc-guc (one per connector), written once (cas 0) by --configure-edc with the connector's token
  edc-fv1: &edcAliases
    tokenSignerPrivateKey: "RSA-2048 PKCS#8 PEM, generated by openssl into a 0700 temp dir"
    tokenSignerPublicKey: "matching public key (PEM)"
    tokenEncryptionAesKey: "256-bit random, base64 (not referenced by chart 0.13.0; kept as in DEV)"
    edc-wallet-secret: "copy of identityhub/<pid>-sts-client-secret, compared by SHA-256 after the write, never printed"
    transfer-process-*/edr--*: "written by the connector at runtime"
  edc-guc: *edcAliases
