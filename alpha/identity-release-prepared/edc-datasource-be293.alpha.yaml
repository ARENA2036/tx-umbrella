# BE-293 Alpha: static data source behind the provider's E2E test asset (be293-edc-fv1). Plain manifests, namespace be293.
# Serves ONE fixed file, /payload.json, from a ConfigMap. The provider data plane fetches it at
#   http://be293-edc-datasource.be293.svc.cluster.local:8080/payload.json
# and the consumer receives exactly these bytes (gate E7 records their SHA-256 so a run can compare the fetched bytes).
# Reachable only from the provider data plane (networkpolicies-be293-edc.alpha.yaml). No credential, no Secret.
#
# Image: nginxinc/nginx-unprivileged (NGINX Inc, Docker Verified Publisher; runs as uid 101 on 8080), pinned by digest
# with tools/identity-pin-be293.sh --pin.
apiVersion: v1
kind: ConfigMap
metadata:
  name: be293-edc-datasource
  namespace: be293
  labels: {app.kubernetes.io/name: be293-edc-datasource, app.kubernetes.io/part-of: be293-edc-e2e}
data:
  payload.json: |
    {"source":"be293-edc-datasource","provider":"BPNL000000000FV1","test":"BE-293 Alpha EDC end-to-end transfer","marker":"be293-e2e-7f3c1a9e"}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: be293-edc-datasource
  namespace: be293
  labels: {app.kubernetes.io/name: be293-edc-datasource, app.kubernetes.io/part-of: be293-edc-e2e}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: be293-edc-datasource}
  template:
    metadata:
      labels: {app.kubernetes.io/name: be293-edc-datasource, app.kubernetes.io/part-of: be293-edc-e2e}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: nginx
          image: "docker.io/nginxinc/nginx-unprivileged:1.27-alpine@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0"
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080, protocol: TCP}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /payload.json, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /payload.json, port: http}
            periodSeconds: 30
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - {name: payload, mountPath: /usr/share/nginx/html, readOnly: true}
            - {name: tmp, mountPath: /tmp}          # pid file and temp paths of the unprivileged image
      volumes:
        - name: payload
          configMap:
            name: be293-edc-datasource
            items: [{key: payload.json, path: payload.json}]
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: be293-edc-datasource
  namespace: be293
  labels: {app.kubernetes.io/name: be293-edc-datasource, app.kubernetes.io/part-of: be293-edc-e2e}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: be293-edc-datasource}
  ports:
    - {name: http, port: 8080, targetPort: http, protocol: TCP}
