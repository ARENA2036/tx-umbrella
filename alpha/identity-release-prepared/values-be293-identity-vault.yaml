# BE-293 Alpha: Vault for the own identity stack (IssuerService, IdentityHub, BDRS) in be293.
# Chart: hashicorp/vault-helm v0.29.1 (alpha/identity-charts/vault-0.29.1.tgz; all 55 files identical to the upstream
# tag, see identity-charts.lock.yaml). Release: be293-identity-vault, namespace be293.
#
# Persistent integrated Raft storage on a PVC (premium-perf1-stackit). Never dev mode, never inmem. No root token in any
# workload: each application gets its own periodic, policy-scoped token (tools/identity-vault-be293.sh --configure).
# Unseal is manual (Shamir keys held by the operator, outside the cluster); after a Vault pod restart the identity stack
# waits until the operator unseals.
fullnameOverride: be293-identity-vault

global:
  enabled: true
  tlsDisable: true          # in-cluster only: ClusterIP + NetworkPolicy (networkpolicies-be293-identity.alpha.yaml)

injector:
  enabled: false
csi:
  enabled: false
ui:
  enabled: false

server:
  enabled: true
  image:
    repository: "hashicorp/vault"
    tag: "1.18.1@sha256:3580fa352195aa7e76449cb8fadeef6d2f90a454c38982d30cf094e9013be786"
  dev:
    enabled: false
  standalone:
    enabled: false
  ha:
    enabled: true
    replicas: 1
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = false
        disable_mlock = true
        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
        }
        storage "raft" {
          path = "/vault/data"
        }
    disruptionBudget:
      enabled: false
  dataStorage:
    enabled: true
    size: 2Gi
    storageClass: premium-perf1-stackit
    accessMode: ReadWriteOnce
  auditStorage:
    enabled: false
  # Keep the Raft data if the StatefulSet is deleted or scaled down (`helm uninstall` never deletes the PVC).
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  # No Kubernetes auth method (applications use scoped tokens), so no cluster-scoped system:auth-delegator binding.
  authDelegator:
    enabled: false
  serviceAccount:
    create: true
    serviceDiscovery:
      enabled: false        # no service_registration in the config, so no pod-label RBAC is needed
  service:
    enabled: true
    type: ClusterIP
  ingress:
    enabled: false
  route:
    enabled: false
  networkPolicy:
    enabled: false          # managed explicitly in networkpolicies-be293-identity.alpha.yaml
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
