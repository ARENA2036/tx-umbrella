# BE-293 Alpha: one PostgreSQL for the own identity stack, one database and one role per application.
# Chart: bitnami postgresql 16.0.0 (alpha/identity-charts/postgresql-16.0.0.tgz), the same vendored chart the two be293
# Keycloak releases already run. Release: be293-identity-postgresql, namespace be293.
#
# Credentials come only from existing Secrets (secrets-contract.identity.yaml):
#   be293-identity-postgresql / postgres-password            superuser, used by the chart only
#   be293-identity-db-users   / ISSUERSERVICE_DB_PASSWORD, IDENTITYHUB_DB_PASSWORD, BDRS_DB_PASSWORD
# The init SQL reads the role passwords from the environment with psql \getenv (PostgreSQL 15 client), so no password is
# in this file, the ConfigMap or the Helm release. It runs once, on the first start with an empty PVC.
fullnameOverride: be293-identity-postgresql

image:
  registry: docker.io
  repository: bitnamilegacy/postgresql
  tag: "15-debian-11"
  digest: "sha256:e5dd504985505a6e30b36a474a1764e9f93fd2367acf5d196dd14827cac7eac4"   # same pin as the Portal (images.lock.yaml)

architecture: standalone

auth:
  enablePostgresUser: true
  existingSecret: be293-identity-postgresql
  secretKeys:
    adminPasswordKey: postgres-password

primary:
  extraEnvVarsSecret: be293-identity-db-users
  initdb:
    scripts:
      01-identity-databases.sql: |
        -- Never write a failed statement (which would contain a password) to the server log.
        SET log_min_error_statement = 'panic';
        SET log_statement = 'none';
        \getenv issuerservice_pw ISSUERSERVICE_DB_PASSWORD
        \getenv identityhub_pw IDENTITYHUB_DB_PASSWORD
        \getenv bdrs_pw BDRS_DB_PASSWORD
        CREATE ROLE issuerservice LOGIN PASSWORD :'issuerservice_pw';
        CREATE ROLE identityhub LOGIN PASSWORD :'identityhub_pw';
        CREATE ROLE bdrs LOGIN PASSWORD :'bdrs_pw';
        CREATE DATABASE issuerservice OWNER issuerservice;
        CREATE DATABASE identityhub OWNER identityhub;
        CREATE DATABASE bdrs OWNER bdrs;
        REVOKE ALL ON DATABASE issuerservice FROM PUBLIC;
        REVOKE ALL ON DATABASE identityhub FROM PUBLIC;
        REVOKE ALL ON DATABASE bdrs FROM PUBLIC;
  persistence:
    enabled: true
    storageClass: premium-perf1-stackit
    size: 8Gi
    accessModes: [ReadWriteOnce]
  persistentVolumeClaimRetentionPolicy:
    enabled: true
    whenDeleted: Retain
    whenScaled: Retain
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  networkPolicy:
    enabled: false          # managed explicitly in networkpolicies-be293-identity.alpha.yaml

readReplicas:
  replicaCount: 0

networkPolicy:
  enabled: false
